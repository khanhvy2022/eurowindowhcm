          - generic [ref=f37e77]:
            - paragraph [ref=f37e78]: Theo thiết kế, hạng mục nhà ga hành khách Cảng hàng không quốc tế Vân Đồn được thiết kế 2 tầng, công suất đáp ứng lưu lượng 5 triệu hành khách/ năm. Nhà ga hàng hóa giai đoạn đến 2020 đáp ứng 10.000 tấn hàng hóa/ năm; đến năm 2030, xây dựng ga hàng hóa độc lập đáp ứng công suất tối thiểu 30.000 tấn hàng hóa/năm.
            - paragraph [ref=f37e79]: Tại dự án này, Eurowindow đã thi công lắp đặt cửa và vách kính mặt dựng, lan can kính, cửa kính tự động và cửa thủy lực cho hạng mục Nhà ga hành khách, Khu nhà điều hành dự án Cảng hàng không quốc tế Vân Đồn (Quảng Ninh).
