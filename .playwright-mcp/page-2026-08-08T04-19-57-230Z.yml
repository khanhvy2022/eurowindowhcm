            - heading "CÔNG TRÌNH CẤP QUỐC GIA" [level=2] [ref=f15e71]
          - paragraph [ref=f15e73]: Trụ sở Bộ Công an
          - paragraph [ref=f15e75]: Công trình trụ sở Bộ Công an được xây dựng trên diện tích đất 5,3 ha, có kiến trúc hiện đại, quy mô tầm cỡ quốc tế.
          - paragraph [ref=f15e78]: Công trình có thiết kế 182.000 m2 sàn, bao gồm diện tích làm việc, hội trường, phòng họp, nhà khách, khu vực thể thao… được xây dựng kiên cố, có thể chống động đất cấp 7, cấp 8, lắp đặt hệ thống thiết bị sử dụng tiết kiệm điện năng, hệ thống điều khiển tòa nhà thông minh và hệ thống kiểm soát an ninh hiện đại. Tại dự án này, Eurowindow đã phụ trách thi công lắp đặt mặt dựng hệ nhôm kính và ốp nhôm mặt đứng của 6 hạng mục trong dự án gồm các khối nhà C, D, E, B1, B3 và B5.
