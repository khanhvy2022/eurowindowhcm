        - paragraph [ref=f2e11]: Về Eurowindow · Từ năm 2002
        - heading "Tiên phong mở ra một kỷ nguyên mới cho ngôi nhà Việt." [level=1] [ref=f2e12]
        - paragraph [ref=f2e13]: "Eurowindow bắt đầu từ một câu hỏi đơn giản: một ngôi nhà Việt Nam đáng sống nhất trông như thế nào? Câu trả lời nằm ở những bộ cửa — nơi ánh sáng, không khí và sự riêng tư được dung hòa với nhau một cách chính xác."
      - figure [ref=f2e14]:
        - img "Không gian văn phòng hiện đại với hệ cửa kính rộng" [ref=f2e16]
      - generic [ref=f2e17]:
        - paragraph [ref=f2e18]: Câu chuyện của chúng tôi
        - article [ref=f2e19]:
          - paragraph [ref=f2e20]: "Từ năm 2002, Eurowindow là đơn vị tiên phong đưa cửa nhựa uPVC tiêu chuẩn châu Âu vào Việt Nam — khi dòng sản phẩm này còn xa lạ với thị trường trong nước. Chúng tôi tin rằng một ngôi nhà đáng sống bắt đầu từ những ranh giới được làm đúng: đóng lại thì yên tĩnh, mở ra thì đón nắng."
          - blockquote [ref=f2e21]: “Chúng tôi không bán cửa. Chúng tôi bảo đảm cho ranh giới giữa ngôi nhà và thế giới bên ngoài.”
          - paragraph [ref=f2e22]: "Sau uPVC, chúng tôi mở rộng sang hệ giải pháp nhôm, gỗ, kính, cửa tự động và các vật liệu hoàn thiện. Mỗi hệ sản phẩm ra đời đều trả lời cùng một câu hỏi: nó giúp người ở sống tốt hơn như thế nào?"
          - heading "Tầm nhìn" [level=2] [ref=f2e23]
          - paragraph [ref=f2e24]: Kiến tạo không gian sống văn minh với các giải pháp xây dựng hiện đại — hài hòa công năng, thẩm mỹ và hiệu quả sử dụng năng lượng.
          - heading "Sứ mệnh" [level=2] [ref=f2e25]
          - paragraph [ref=f2e26]: Đặt con người và môi trường ở vị trí trung tâm trong mọi quyết định thiết kế, để mỗi công trình không chỉ đẹp hôm nay mà còn bền vững với ngày mai.
          - heading "Cam kết" [level=2] [ref=f2e27]
          - paragraph [ref=f2e28]: Tư vấn rõ ràng, triển khai đồng bộ và đồng hành sau bàn giao để mỗi công trình duy trì giá trị bền vững theo thời gian.
