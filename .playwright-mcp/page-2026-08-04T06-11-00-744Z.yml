        - generic [ref=f11e128]:
          - generic [ref=f11e129]:
            - generic [ref=f11e130]: Áp dụng công nghệ sản xuất hiện đại từ Ý, Tây Ban Nha, Nga, các sản phẩm cửa gỗ Eurowindow vừa giữ được tính năng của gỗ tự nhiên, vừa có độ cứng và độ bền cao, hạn chế tối đa sự biến đổi theo thời tiết như cong vênh, co ngót.
            - paragraph [ref=f11e131]: Nếu như sản phẩm cửa uPVC được chọn là giải pháp hoàn hảo cho mặt ngoài của ngôi nhà (cửa sổ và cửa ban công) thì sản phẩm cửa gỗ được xem như một giải pháp tối ưu bên trong (cửa thông phòng), phù hợp với nội thất trong nhà.
            - paragraph [ref=f11e132]: "Trước đây người ta thường chọn các loại gỗ Đinh, Lim, Sến, Táu, Nghiến hay Lát Hoa để làm cửa nhằm tận dụng các đặc tính tốt như: cứng, chắc, khả năng chịu nén, kháng mối mọt cao và vân gỗ đẹp. Mặc dù đây là những loại gỗ quý hiếm nhưng khi dùng gỗ nguyên tấm có kích thước lớn thì cửa vẫn có sự co ngớt nhất định hoặc đôi khi bị nứt do thay đổi độ ẩm và nhiệt độ."
            - paragraph [ref=f11e133]: "Với nhà máy sản xuất cửa gỗ được đầu tư xây dựng hiện đại, đồng bộ tại KCN Quang Minh, Mê Linh – Hà Nội và KCN Tân Uyên – Bình Dương, cùng quá trình nghiên cứu của Eurowindow và sự chuyên giao công nghệ bởi các nhà sản xuất lâu đời, nổi tiếng có nhiều năm kinh nghiệm từ Ý, Tây Ban Nha, Nga cho phép sản phẩm cửa gỗ Eurowindow vừa giữ được những tính năng của cửa làm từ các vật liệu gỗ tự nhiên, vừa có nhiều tính năng ưu việt như: ổn định, kít khít, đóng mở êm, thẩm mỹ cao, thời gian thi công nhanh."
            - paragraph [ref=f11e134]: Sản phẩm cửa gỗ Eurowndow không chỉ có mẫu mã đa dạng và được thiết kế theo nhiều phong cách khác nhau từ cổ điển, bán cổ điển, hiện đại đến hi-tech mà còn đạt tiêu chuẩn TCVN9366-1:2021 về độ bền áp lực gió, độ kín nước và độ bền chịu va đập.
            - paragraph [ref=f11e135]:
              - strong [ref=f11e136]: TÍNH ƯU VIỆT CỦA SẢN PHẨM CỬA GỖ
            - list [ref=f11e137]:
              - listitem [ref=f11e138]:
                - generic [ref=f11e139]:
                  - strong [ref=f11e140]: Tính ổn định
                  - text: ": Nguyên liệu đầu vào được xử lý, tẩm sấy theo tiêu chuẩn độ ẩm xuất khẩu (12-14%), gỗ rừng trồng ghép thanh được xử lý theo công nghệ biến tính gỗ nên cửa gỗ Eurowindow có độ cứng và độ bền cao, hạn chế được sự biến đổi của gỗ theo thời tiết như cong vênh, co ngót."
              - listitem [ref=f11e141]:
                - generic [ref=f11e142]:
                  - strong [ref=f11e143]: Đóng mở êm, kín khít, khả năng cách âm, cách nhiệt cao
                  - text: ": Sản phẩm cửa gỗ Eurowindow có sử dụng hệ thống gioăng chuyên dụng được nhập khẩu từ châu Âu giúp cửa đóng mở êm, kín khít, tăng khả năng cách âm, cách nhiệt."
              - listitem [ref=f11e144]:
                - generic [ref=f11e145]:
                  - strong [ref=f11e146]: Tính thẩm mỹ
                  - text: ": Lựa chọn gỗ trước khi đưa vào sản xuất và hệ thống phun sơn tự động cho phép cửa gỗ Eurowindow có độ phẳng về bề mặt, đồng đều về màu sắc, tính thẩm mỹ cao và tăng độ bền của sản phẩm."
              - listitem [ref=f11e147]:
                - generic [ref=f11e148]:
                  - strong [ref=f11e149]: Thời gian thi công nhanh
                  - text: ": Toàn bộ sản phẩm khuôn, cửa gỗ Eurowindow được thiết kế phù hợp cho việc lắp dựng công nghiệp ở giai đoạn cuối hoàn thiện của các công trình, từ đó có thể đẩy nhanh tiến độ lắp dựng nên tiết kiệm tối đa thời gian thi công."
              - listitem [ref=f11e150]:
                - generic [ref=f11e151]:
                  - strong [ref=f11e152]: Hiệu quả kinh tế cao
                  - text: ": cửa Eurowindow có độ bền cao, khả năng cách âm, cách nhiệt tốt nên đem lại hiệu quả kinh tế cho người sử dụng."
            - paragraph [ref=f11e153]: "Cửa gỗ Eurowindow thiết kế đa dạng về kiểu dáng, mẫu mã như: pano kính, pano đặc, với các đường chỉ nổi, chỉ liền… đáp ứng được hầu hết các nhu cầu về cửa đi chính, cửa thông phòng cho các công trình xây dựng."
          - link "Xem thêm" [ref=f11e154] [cursor=pointer]:
            - /url: javascript:;
