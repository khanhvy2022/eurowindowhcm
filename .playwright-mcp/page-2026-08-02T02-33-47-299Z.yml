            - paragraph [ref=f16e73]: Eurowindow was founded in 2002 as the pioneer bringing European-standard uPVC doors to the Vietnamese market.
            - paragraph [ref=f16e74]: Today our ecosystem covers uPVC, aluminium-glass, wooden and automatic door systems, glass partitions and finishing materials — connecting design, production, construction and care for long-term value.
            - paragraph [ref=f16e75]: With the vision of becoming Vietnam's leading brand in door and glass-partition solutions and expanding internationally, Eurowindow keeps creating sustainable value for the community through quality, habitative, aesthetic and eco-friendly living and working spaces.
