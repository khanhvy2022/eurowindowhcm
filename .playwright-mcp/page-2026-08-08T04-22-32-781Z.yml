            - heading "CÔNG TRÌNH DÂN DỤNG" [level=2] [ref=f22e71]
          - paragraph [ref=f22e73]: Biệt thự KĐT Green Pearl 378 Minh Khai, Hà Nội
          - paragraph [ref=f22e75]: Mang phong cách hiện đại và sang trọng, căn biệt thự tại KĐT Green Pearl, Hà Nội nổi bật với gam màu trắng sữa chủ đạo. Sự kết hợp giữa màu vàng đồng của tường rào, cổng, lan can và màu vân gỗ của cửa tạo nên điểm nhấn nổi bật cho tổng thể công trình.
          - paragraph [ref=f22e78]: Biệt thự sử dụng cửa và vách kính Eurowindow hệ nhôm EA55 sơn màu vân gỗ, lắp kính hộp 2 lớp kính cường lực và phụ kiện đồng bộ của hãng Roto (CHLB Đức). Đây là hệ nhôm với thiết kế cánh bo tròn cải tiến, màu sơn vân gỗ giúp gia tăng tính thẩm mỹ, phù hợp với nội thất bên trong công trình. Không chỉ có tính cách âm, cách nhiệt tốt, cửa còn đón ánh sáng tự nhiên vào từng căn phòng, tạo tầm nhìn thoáng rộng ra cảnh quan xung quanh.
