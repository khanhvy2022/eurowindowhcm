            - heading "CÔNG TRÌNH CẤP QUỐC GIA" [level=2] [ref=f10e71]
          - paragraph [ref=f10e73]: Nhà Quốc hội
          - paragraph [ref=f10e75]: Công trình Nhà Quốc hội mang tính biểu tượng quốc gia, có ý nghĩa chính trị đặc biệt quan trọng; là nơi diễn ra các phiên họp toàn thể của Quốc hội Việt Nam; nơi đón tiếp các nguyên thủ quốc gia và tổ chức các nghi lễ, sự kiện, hội thảo mang tầm quốc tế.
          - generic [ref=f10e77]:
            - list [ref=f10e78]:
              - listitem [ref=f10e79]: "Chủ đầu tư: Ban QL dự án xây dựng nhà Quốc Hội & Hội trường Ba Đình"
              - listitem [ref=f10e80]: "Tư vấn thiết kế: Công ty tư vấn Thiết kế GMP (Đức)"
            - paragraph [ref=f10e81]: Công trình có quy mô 2 tầng hầm, 5 tầng nổi, được đánh giá là có kiến trúc phức tạp nhất từ trước đến nay do các nhà thầu Việt Nam xây dựng. Công trình sử dụng hơn 7.800 m2 vách nhôm kính lớn Eurowindow hệ Stick, profle của hãng Schueco, vách kính chống cháy và 2.700 m2 cửa gỗ chống cháy, rèm ngăn lửa, ngăn khói, cửa tự động, mái kính Skylight, lan can kính… Toàn bộ cửa tại công trình Nhà Quốc hội có kích thước lớn hơn so với cửa thông thường, sử dụng hệ thống khóa điện tử phức tạp và cảm biến chống cháy, đáp ứng tiêu chuẩn kỹ thuật, đảm bảo mức độ an ninh cao.
