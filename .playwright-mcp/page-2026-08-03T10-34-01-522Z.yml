        - generic [ref=e163]:
          - paragraph [ref=e164]: Sản phẩm được sản xuất từ gỗ tự nhiên nguyên tấm đã qua xử lý bằng công nghệ biến tính gỗ. Nhờ đó cửa gỗ tự nhiên Eurowindow không chỉ đảm bảo tính thẩm mỹ, chất lượng ổn định mà còn hạn chế tối đa sự cong vênh, co ngót trước điều kiện khí hậu ở Việt Nam.
          - paragraph [ref=e165]:
            - strong [ref=e166]: "Đặc điểm:"
          - list [ref=e167]:
            - listitem [level=1] [ref=e168]: Đảm bảo phù hợp với kiến trúc nội thất bên trong ngôi nhà.
            - listitem [level=1] [ref=e169]: Sản phẩm làm ra có chất lượng tốt, độ chính xác cao nhờ được sản xuất trên dây chuyền máy móc đồng bộ, hiện đại.
            - listitem [level=1] [ref=e170]: Dây chuyền sơn công nghiệp hoàn toàn tự động giúp bảo vệ cho gỗ tốt hơn, tăng tuổi thọ của sản phẩm và tính thẩm mỹ.
            - listitem [level=1] [ref=e171]: Cửa gỗ Eurowindow sử dụng hệ gioăng cao su chuyên dụng, bản lề cân chỉnh được, hệ phụ kiện đồng bộ đảm bảo độ kín khít giúp cửa đóng mở êm.
            - listitem [level=1] [ref=e172]: Hạn chế cong vênh, co ngót.
            - listitem [level=1] [ref=e173]: Đa dạng về kiểu dáng và kích thước.
