            - heading "CÔNG TRÌNH DÂN DỤNG" [level=2] [ref=f20e71]
          - paragraph [ref=f20e73]: Nhà phố Chùa Thông, TX. Sơn Tây, Hà Nội
          - paragraph [ref=f20e75]: Tọa lạc trên phố Chùa Thông, thị xã Sơn Tây, Hà Nội, căn nhà phố rộng gần 400m2, cao 6 tầng được gia chủ sử dụng vừa để kinh doanh và sinh sống. Với mong muốn sở hữu một không gian sống hiện đại, tiện nghị và yên tĩnh, gia chủ đã lựa chọn lắp đặt toàn bộ hệ thống cửa và vách kính Eurowindow.
          - paragraph [ref=f20e78]: Trong đó, cửa sổ, cửa đi mở quay, cửa đi xếp trượt sử dụng hệ nhôm EA55, cửa đi mở trượt hệ nhôm EA90 được lắp tại phòng khách và vách dựng mặt tiền sử dụng nhôm FA52. Cửa và vách kính được tận dụng tối đa, thay thế các mảng tường tạo nên một không gian rộng rãi, thoáng đãng và đón tối đa ánh sáng tự nhiên vào bên trong căn phòng.
