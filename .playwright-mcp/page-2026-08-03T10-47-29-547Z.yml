            - generic [ref=e66]:
              - generic [ref=e67]: 30/10/2025
              - link "Tin khuyến mãi" [ref=e70] [cursor=pointer]:
                - /url: https://eurowindow.biz/tin-tuc/tin-khuyen-mai
              - generic [ref=e73]: 30213 Lượt xem
            - generic [ref=e77]:
              - paragraph [ref=e78]: Tưng bừng ưu đãi dịp cuối năm, từ ngày 31/10 đến 15/12/2025, Eurowindow triển khai chương trình khuyến mãi “MỞ CỬA HÔM NAY – NHẬN NGAY ƯU ĐÃI” dành cho khách hàng nhà riêng trên phạm vi toàn quốc.
              - paragraph [ref=e79]: Theo đó, 100% khách hàng mua và lắp đặt sản phẩm Eurowindow cho công trình nhà riêng trong thời gian khuyến mãi sẽ được giảm ngay 10% giá trị sản phẩm (trước VAT) và nhận nhiều quà tặng hấp dẫn gồm iPhone 17 Pro Max, máy lọc không khí LG, robot lau kính Nhật Bản… Đặc biệt, khách hàng sẽ được giảm thêm 2% khi thanh toán 100% giá trị trong vòng 5 ngày sau khi ký HĐ/PLHĐ.
              - paragraph [ref=e80]: Đây là cơ hội “vàng” để khách hàng nhanh tay sở hữu các giải pháp cửa – vách kính cao cấp Eurowindow, hoàn thiện tân gia hay cải tạo nhà cửa chuẩn bị đón năm mới.
              - generic [ref=e81]:
                - img "viber-image-2025-10-30-17-49-25-741" [ref=e83]
                - paragraph [ref=e84]:
                  - strong [ref=e85]: THỂ LỆ CHƯƠNG TRÌNH KHUYẾN MÃI
              - list [ref=e86]:
                - listitem [ref=e87]:
                  - strong [ref=e88]: "Tên chương trình:"
                  - strong [ref=e89]: “MỞ CỬA HÔM NAY– NHẬN NGAY ƯU ĐÃI”
                - listitem [ref=e90]:
                  - strong [ref=e91]: "Hàng hoá, dịch vụ dùng để khuyến mãi:"
                  - text: Sản phẩm Eurowindow.
                - listitem [ref=e92]:
                  - strong [ref=e93]: "Thời gian khuyến mãi: 31/10/2025 – 15/12/2025."
                - listitem [ref=e94]:
                  - strong [ref=e95]: "Đối tượng và phạm vi tổ chức khuyến mãi:"
              - list [ref=e96]:
                - listitem [ref=e97]: Khách hàng nhà riêng toàn quốc khi ký hợp đồng, phụ lục hợp đồng với Eurowindow.
              - list [ref=e98]:
                - listitem [ref=e99]:
                  - strong [ref=e100]: "Chi tiết nội dung và thể lệ tham gia CTKM:"
              - list [ref=e101]:
                - listitem [ref=e102]: "Giảm giá sản phẩm: Giảm giá 10% trước VAT cho tất cả các sản phẩm."
                - listitem [ref=e103]: "Quà tặng:"
              - paragraph [ref=e104]: + Các khách hàng ký hợp đồng mua hàng dưới 100 triệu đồng sẽ nhận được 01 áo mưa hoặc 01 dù Eurowindow, tặng ngay sau khi ký hợp đồng.
              - paragraph [ref=e105]: + Các khách hàng ký hợp đồng mua hàng từ 100 triệu đồng đến dưới 300 triệu đồng sẽ nhận được 01 đế sạc không dây in Logo Eurowindow, tặng ngay sau khi ký hợp đồng và KH hoàn thành thủ tục thanh toán cọc theo CTKM.
              - paragraph [ref=e106]: + Các khách hàng ký hợp đồng mua hàng từ 300 triệu đồng đến dưới 500 triệu đồng sẽ nhận được 01 rô bốt lau kính Tahawa (Nhật Bản) trị giá 9.4 triệu đồng hoặc sản phẩm rô bốt lau kính có giá trị tương đương, tặng ngay sau khi ký hợp đồng và KH hoàn thành thủ tục thanh toán cọc theo CTKM.
              - paragraph [ref=e107]: "+ Các khách hàng ký hợp đồng mua hàng từ 500 triệu đồng đến dưới 1 tỷ đồng: sẽ nhận được 01 máy lọc không khí của hãng LG trị giá 28.8 triệu đồng hoặc máy lọc không khí có giá trị tương đương, tặng ngay sau khi ký hợp đồng và KH hoàn thành thủ tục thanh toán cọc theo CTKM."
              - paragraph [ref=e108]: + Các khách hàng ký hợp đồng mua hàng từ 1 tỷ đồng trở lên sẽ nhận được 01 Iphone 17 Pro Max 256GB trị giá 38 triệu đồng, tặng ngay sau khi ký hợp đồng và KH hoàn thành thủ tục thanh toán cọc theo CTKM.
              - list [ref=e109]:
                - listitem [ref=e110]: Chiết khấu 2% giá trị HĐ/PLHĐ (sau VAT) khi Khách hàng thanh toán 100% giá trị HĐ/ PLHĐ trong vòng 5 ngày kể từ ngày ký HĐ/ PLHĐ. Trường hợp phát sinh PL tăng của HĐKM và Khách hàng thanh toán 100% PL sẽ được giảm thêm 2%.
                - listitem [ref=e111]:
                  - generic [ref=e112]:
                    - strong [ref=e113]: "Điều kiện:"
                    - text: Khuyến mãi chỉ áp dụng cho các hợp đồng/phụ lục hợp đồng nhà riêng ký trong thời gian khuyến mãi từ ngày 31/10/2025 đến hết ngày 15/12/2025, và hoàn thành thủ tục thanh toán đặt cọc 30% giá trị hợp đồng/ phụ lục hợp đồng trở lên trong thời gian hết ngày 25/12/2025. Nếu sau ngày 25/12/2025, khách hàng vẫn chưa hoàn thành thủ tục đặt cọc theo quy định sẽ không được tham gia chương trình khuyến mãi
              - list [ref=e114]:
                - listitem [ref=e115]:
                  - strong [ref=e116]: "Các quy định khác:"
              - list [ref=e117]:
                - listitem [ref=e118]: Chương trình khuyến mại không áp dụng đồng thời với các chương trình khác của Eurowindow.
                - listitem [ref=e119]: Quà tặng không quy đổi thành tiền mặt.
                - listitem [ref=e120]: Trong trường hợp phát sinh tranh chấp, khiếu nại liên quan đến chương trình khuyến mãi, Công ty Cổ phần Eurowindow sẽ trực tiếp đứng ra giải quyết và quyết định của Công ty Cổ phần Eurowindow là quyết định cuối cùng.
