    - generic [ref=f13e63]:
      - generic [ref=f13e65]:
        - paragraph [ref=f13e66]: Năm 2002, Eurowindow tiên phong đưa cửa hiện đại uPVC tiêu chuẩn Châu Âu vào thị trường trong nước, làm nên cuộc cách mạng về cửa và mở ra “kỷ nguyên mới” cho những ngôi nhà Việt.
        - paragraph [ref=f13e67]:
          - text: Qua hơn hai thập kỷ, Eurowindow không ngừng
          - strong [ref=f13e68]: TIÊN PHONG
          - text: "ứng dụng công nghệ mới, phát triển đa dạng các dòng sản phẩm gồm: cửa uPVC, cửa nhôm, vách nhôm kính lớn, cửa gỗ, cửa gỗ chống cháy, cửa tự động, cửa cuốn, cửa thủy lực, các sản phẩm kính, nội thất… Mới đây nhất, bộ giải pháp cửa thông minh thế hệ mới Eurowindow tích hợp công nghệ 4.0, thiết kế đa công năng, đem đến sự tiện nghi tối ưu cho người dùng."
        - paragraph [ref=f13e69]:
          - text: Luôn dẫn dắt nhu cầu và tạo ra xu hướng tiêu dùng mới, Eurowindow đã và đang góp phần
          - strong [ref=f13e70]: KIẾN TẠO
          - text: "diện mạo kiến trúc các đô thị. Sản phẩm Eurowindow hiện diện ở hàng trăm nghìn công trình tại Việt Nam và nước ngoài, từ các tòa nhà chung cư, biệt thự, văn phòng, trụ sở làm việc các cơ quan nhà nước, tòa nhà ngân hàng, khách sạn, trường học, bệnh viện... cho đến các công trình trọng điểm như: Tòa nhà Quốc hội, Tòa nhà chính phủ, cảng hàng không quốc tế..."
        - paragraph [ref=f13e71]:
          - strong [ref=f13e72]: ĐỒNG HÀNH
          - text: cùng khách hàng từ khâu tư vấn, thiết kế cho tới thi công, bảo trì, bảo hành sản phẩm, đồng hành với đối tác toàn cầu trên tinh thần tương hỗ, cộng hưởng, cùng gia tăng giá trị dài hạn, Eurowindow mong muốn mang tới những trải nghiệm khác biệt, kiến thiết cuộc sống phồn vinh cho toàn xã hội.
      - img "20200609-eurowindow-office-building-dsc3068-hdr-edit-copy-052523-1-1" [ref=f13e74]
