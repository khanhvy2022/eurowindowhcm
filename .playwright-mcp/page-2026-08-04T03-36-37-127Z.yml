          - generic [ref=f1e76]:
            - generic [ref=f1e77]:
              - paragraph [ref=f1e78]: Giới thiệu
              - generic [ref=f1e79]:
                - paragraph [ref=f1e80]: Cửa nhôm và vách nhôm kính lớn Eurowindow được sản xuất từ vật liệu nhôm cao cấp, khắc phục triệt tiêu những nhược điểm của nhôm thông thường như kết cấu yếu, phụ kiện đơn giản, không có cầu cách nhiệt nên khả năng cách âm, cách nhiệt kém, hay bị rò rỉ nước mưa.
                - paragraph [ref=f1e81]: Cửa nhôm (gồm cửa sổ, cửa đi) và cửa vách nhôm đảm bảo độ kín khít cao, có thể đóng mở đa chiều, phù hợp với nhiều kiểu phong cách kiến trúc. Đặc biệt, profile nhôm có cầu cách nhiệt kết hợp với hộp kính bơm khí trơ giúp hạn chế tối đa sự truyền nhiệt, góp phần tiết kiệm điện năng. Bên cạnh hợp tác chiến lược với các nhà cung cấp profile nhôm hàng đầu thế giới như Technal (Pháp), Shueco (CHLB Đức), Eurowindow còn đầu tư dây chuyền sơn tĩnh điện (Powdercoating) và sơn nước (PVDF), cho phép sơn tấm nhôm gấp khổ lớn tới 2,5m x 2,5m x 6m, cùng hệ thống xử lý nước thải đạt chuẩn A Grade.
            - generic [ref=f1e82]:
              - paragraph [ref=f1e83]: Cấu tạo & công nghệ
              - generic [ref=f1e84]:
                - generic [ref=f1e85]:
                  - heading "Thanh profile" [level=3] [ref=f1e86]
                  - paragraph [ref=f1e87]: Thanh profile có cầu cách nhiệt hoặc không, với các khoang rỗng và gân tăng cứng, rãnh và vách kỹ thuật được tính toán kỹ lưỡng tạo sống gia cường, kênh thoát nước và khoang trống cách âm, cách nhiệt.
                - generic [ref=f1e88]:
                  - heading "Hộp kính" [level=3] [ref=f1e89]
                  - paragraph [ref=f1e90]: Kết hợp hộp kính bơm khí trơ, hệ gioăng EPDM và hệ phụ kiện kim khí đồng bộ để đạt hiệu quả cách âm, cách nhiệt cao.
                - generic [ref=f1e91]:
                  - heading "Hệ phụ kiện" [level=3] [ref=f1e92]
                  - paragraph [ref=f1e93]: Phụ kiện kim khí chính hãng Cmech, Roto, Hafele, Huy Hoàng, GMT, Kinlong tạo sự chính xác và an toàn trong sử dụng.
          - generic [ref=f1e94]:
            - paragraph [ref=f1e95]: Ưu điểm nổi bật
            - generic [ref=f1e96]:
              - generic [ref=f1e97]:
                - heading "Cách âm, cách nhiệt" [level=3] [ref=f1e98]
                - paragraph [ref=f1e101]: Profile nhôm có cầu cách nhiệt kết hợp hộp kính, gioăng EPDM và phụ kiện đồng bộ đem lại tính cách âm, cách nhiệt cao — đặc biệt với dòng có cầu cách nhiệt.
              - generic [ref=f1e102]:
                - heading "Chịu lực tốt" [level=3] [ref=f1e103]
                - paragraph [ref=f1e106]: Thanh profile thiết kế khoang rỗng, gân tăng cứng và chiều dày nhôm hợp lý giúp chịu tác động từ gió, bão, động đất.
              - generic [ref=f1e107]:
                - heading "Tải trọng nhẹ" [level=3] [ref=f1e108]
                - paragraph [ref=f1e111]: Nhôm là vật liệu nhẹ, độ bền cao, giảm tải trọng toàn công trình so với vách tường vật liệu khác, mang lại giải pháp an toàn tối ưu.
              - generic [ref=f1e112]:
                - heading "Kinh tế trong sử dụng" [level=3] [ref=f1e113]
                - paragraph [ref=f1e116]: Hộp kính cách âm, cách nhiệt, kính an toàn giúp tiết kiệm điện năng điều hòa; bề mặt sơn tĩnh điện bền màu, chỉ cần lau chùi thông thường.
              - generic [ref=f1e117]:
                - heading "Tính thẩm mỹ" [level=3] [ref=f1e118]
                - paragraph [ref=f1e121]: Hệ vách giấu đố chịu lực tạo mặt phẳng kính lớn, sử dụng kính màu, kính hoa văn, kính mài mờ vừa đảm bảo kín đáo vừa thẩm mỹ.
              - generic [ref=f1e122]:
