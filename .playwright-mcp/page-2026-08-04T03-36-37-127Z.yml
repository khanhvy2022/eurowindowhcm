                - paragraph [ref=f1e126]: Đạt tiêu chuẩn Châu Âu và TCVN 330:2004, TCVN 7452-1/2/3:2004 (lọt khí, kín nước, chịu áp lực gió), ISO 140-5 về cách âm.
