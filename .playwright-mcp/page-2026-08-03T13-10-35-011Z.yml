            - heading "CÔNG TRÌNH CẤP QUỐC GIA" [level=2] [ref=f32e71]
          - paragraph [ref=f32e73]: Trụ sở Bộ Ngoại giao
          - paragraph [ref=f32e75]: Công trình Trụ sở Bộ Ngoại giao mới là 1 trong 6 công trình "Kiến trúc Pháp trong lòng Hà Nội", có tổng mức đầu tư xây dựng khoảng 3.500 tỷ đồng.
          - generic [ref=f32e77]:
            - paragraph [ref=f32e78]: Công trình là tổ hợp công trình kiến trúc gồm 01 khối đế và 03 khối nhà cao 13 - 14 tầng cùng hệ thống đường giao thông, bãi để xe, vườn hoa, cây xanh, hồ nước, các khu thể thao và các công trình kỹ thuật hạ tầng ngoài nhà. Công trình sau khi hoàn thiện có công năng hiện đại, là nơi tổ chức các nghi lễ tiếp khách, hội nghị/ họp báo quốc tế, khu làm việc của các lãnh đạo Bộ, văn phòng và các Cục, Vụ, Viện chức năng của Bộ, khu tiếp đón công dân…
            - paragraph [ref=f32e79]: Tại dự án này, Eurowindow thi công lắp đặt hoàn thiện hơn 8.000 m2 cửa nhôm và vách nhôm kính lớn, cửa chống cháy…
