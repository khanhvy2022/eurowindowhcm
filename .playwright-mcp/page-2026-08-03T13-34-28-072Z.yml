            - generic [ref=f46e77]:
              - paragraph [ref=f46e78]: Introduction
              - generic [ref=f46e79]:
                - paragraph [ref=f46e80]: Eurowindow aluminium doors and large glass partitions are manufactured from premium aluminium profiles (EA55–EA95i) with genuine European hardware from Cmech, Roto and Hafele. The multi-chambered thermal-break profiles combined with gas-fill insulating glass units minimise thermal transfer while maximising light transmittance.
                - paragraph [ref=f46e81]: Eurowindow collaborates with leading aluminium profile suppliers worldwide — Technal (France), Schüco (Germany) — and operates in-house powder-coating (Powdercoating) and PVDF paint lines allowing panel finishing up to 2.5m × 2.5m × 6m, with wastewater treatment meeting A-Grade standards.
            - generic [ref=f46e82]:
              - paragraph [ref=f46e83]: Structure & technology
              - generic [ref=f46e84]:
                - generic [ref=f46e85]:
                  - heading "Profile bar" [level=3] [ref=f46e86]
                  - paragraph [ref=f46e87]: Profile bars feature thermal-break or standard chambers with reinforcing ribs, engineered drainage channels and acoustic/thermal cavity design.
                - generic [ref=f46e88]:
                  - heading "Insulating glass unit" [level=3] [ref=f46e89]
                  - paragraph [ref=f46e90]: Combined with argon-fill IGUs, EPDM gaskets and synchronised metal hardware for superior acoustic and thermal performance.
                - generic [ref=f46e91]:
                  - heading "Hardware system" [level=3] [ref=f46e92]
                  - paragraph [ref=f46e93]: Genuine European hardware from Cmech, Roto, Hafele, Huy Hoang, GMT, Kinlong ensuring precision and safety in operation.
          - generic [ref=f46e94]:
            - paragraph [ref=f46e95]: Outstanding features
            - generic [ref=f46e96]:
              - generic [ref=f46e97]:
                - heading "Acoustic & thermal insulation" [level=3] [ref=f46e98]
                - paragraph [ref=f46e101]: Thermal-break aluminium profiles combined with IGUs, EPDM gaskets and synchronised hardware deliver superior acoustic and thermal performance — especially in the thermal-break series.
              - generic [ref=f46e102]:
                - heading "High structural strength" [level=3] [ref=f46e103]
                - paragraph [ref=f46e106]: Hollow-chamber profile design with reinforcing ribs and optimised aluminium thickness withstands wind, storm and seismic forces.
              - generic [ref=f46e107]:
                - heading "Lightweight load" [level=3] [ref=f46e108]
                - paragraph [ref=f46e111]: Aluminium is lightweight yet high-strength, reducing overall building load compared to solid wall materials for safer design.
              - generic [ref=f46e112]:
                - heading "Cost-effective operation" [level=3] [ref=f46e113]
                - paragraph [ref=f46e116]: Acoustic/thermal IGUs and safety glass reduce air-conditioning energy; powder-coated surfaces are durable and easy to maintain.
              - generic [ref=f46e117]:
                - heading "Aesthetic appeal" [level=3] [ref=f46e118]
                - paragraph [ref=f46e121]: Hidden-load-bearing frame system creates large flat glass surfaces; suitable for coloured, decorative and frosted glass for both privacy and aesthetics.
              - generic [ref=f46e122]:
                - heading "Quality standards" [level=3] [ref=f46e123]
                - paragraph [ref=f46e126]: Meets European standards and TCVN 330:2004, TCVN 7452-1/2/3:2004 (airtightness, water tightness, wind pressure resistance), ISO 140-5 for acoustics.
