          - generic [ref=f42e39]:
            - paragraph [ref=f42e40]: Eurowindow được thành lập từ năm 2002, là đơn vị tiên phong đưa cửa nhựa uPVC tiêu chuẩn châu Âu vào Việt Nam — khi dòng sản phẩm này còn xa lạ với thị trường trong nước. Với quan niệm “tạo dựng ranh giới sống đúng đắn”, chúng tôi kiến tạo những không gian hữu dụng, thẩm mỹ, bền vững và kinh tế để phục vụ cộng đồng.
            - paragraph [ref=f42e41]: "Sau hơn 20 năm phát triển, Eurowindow mở rộng sang hệ giải pháp nhôm, gỗ, kính, cửa tự động và vật liệu hoàn thiện. Mỗi hệ sản phẩm ra đời đều trả lời cùng một câu hỏi: nó giúp người ở sống tốt hơn như thế nào?"
