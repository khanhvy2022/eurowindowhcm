        - generic [ref=f15e128]:
          - generic [ref=f15e129]:
            - heading [level=2] [ref=f15e130]:
              - strong [ref=f15e131]: 1. Ưu điểm nổi bật của sản phẩm kính Eurowindow
            - heading [level=3] [ref=f15e132]:
              - strong [ref=f15e133]: 1.1. Độ an toàn cao, phù hợp nhiều hạng mục công trình
            - paragraph [ref=f15e134]: Kính Eurowindow được sản xuất trên dây chuyền hiện đại, có thể ứng dụng cho nhiều hạng mục như vách kính lớn, vách ngăn, cửa thủy lực, lan can cầu thang, cửa sổ, cửa đi, buồng tắm kính, bàn kính hoặc cửa xe ô tô.
            - paragraph [ref=f15e135]: Các dòng kính như kính cường lực, kính bán cường lực và kính dán an toàn có khả năng chịu lực cơ học tốt, giúp tăng độ an toàn khi sử dụng trong nhà ở, công trình dân dụng và công trình công nghiệp.
            - generic [ref=f15e136]:
              - img "Sản phẩm kính của Eurowindow đảm bảo độ an toàn, phù hợp với nhiều hạng mục công trình" [ref=f15e137]
              - paragraph [ref=f15e138]: Sản phẩm kính của Eurowindow đảm bảo độ an toàn, phù hợp với nhiều hạng mục công trình
            - heading [level=3] [ref=f15e139]:
              - strong [ref=f15e140]: 1.2. Đáp ứng nhiều tiêu chuẩn chất lượng quốc tế
            - paragraph [ref=f15e141]: Sản phẩm kính Eurowindow được Viện Tiêu chuẩn Anh BSI cấp chứng chỉ Kitemark và đáp ứng nhiều tiêu chuẩn quốc tế như BS EN 12150-1:2000, BS EN 14449:2005, BS EN 1279-2:2002, EN 1863, ANSI Z97.1-2004, ECE R43. Đây là cơ sở quan trọng cho thấy sản phẩm được kiểm soát theo các yêu cầu nghiêm ngặt về chất lượng, độ bền và độ an toàn trong quá trình sử dụng.
            - heading [level=3] [ref=f15e142]:
              - strong [ref=f15e143]: 1.3. Sản xuất trên dây chuyền hiện đại, kiểm soát chất lượng chặt chẽ
            - paragraph [ref=f15e144]: Eurowindow đầu tư Trung tâm gia công kính tại Khu công nghiệp Quang Minh, Mê Linh, Hà Nội với hệ thống thiết bị nhập khẩu từ các quốc gia châu Âu như Italia, Phần Lan, Thụy Sĩ và Đức. Trung tâm được trang bị máy cắt kính khổ lớn, máy mài song cạnh, máy khoan, máy gia công CNC, lò tôi kính phẳng, dây chuyền sản xuất kính dán an toàn, dây chuyền sản xuất hộp kính và thiết bị kiểm tra Heat-Soak-Test để loại bỏ kính lỗi sau khi tôi.
            - paragraph [ref=f15e145]: Nhờ đó, sản phẩm kính được gia công đồng bộ, đảm bảo độ chính xác và tính ổn định trước khi đưa vào công trình.
            - generic [ref=f15e146]:
              - img "Các sản phẩm kính của Eurowindow được gia công đồng bộ, đảm bảo độ chính xác trước khi đưa vào công trình" [ref=f15e147]
              - paragraph [ref=f15e148]: Các sản phẩm kính của Eurowindow được gia công đồng bộ, đảm bảo độ chính xác trước khi đưa vào công trình
            - heading [level=3] [ref=f15e149]:
              - strong [ref=f15e150]: 1.4. Gia công được kính khổ lớn, đáp ứng thiết kế hiện đại
            - paragraph [ref=f15e151]: Trung tâm kính Eurowindow có khả năng tôi kính cường lực và bán cường lực với độ dày từ 4mm đến 19mm, kích thước tối đa lên đến 2.800 × 6.000mm. Khả năng gia công kính khổ lớn giúp sản phẩm phù hợp với các công trình cần mở rộng tầm nhìn, tăng diện tích lấy sáng và tạo hiệu ứng không gian thông thoáng như mặt dựng kính, vách kính lớn, showroom, sảnh tòa nhà hoặc các công trình kiến trúc hiện đại.
            - heading [level=3] [ref=f15e152]:
              - strong [ref=f15e153]: 1.5. Cách âm, cách nhiệt và hỗ trợ tiết kiệm năng lượng
            - paragraph [ref=f15e154]: Kính Eurowindow có khả năng cách âm, cách nhiệt, hỗ trợ kiểm soát nhiệt độ và tiếng ồn trong không gian sử dụng. Đặc biệt, Eurowindow ứng dụng công nghệ tôi kính Super Soft Coating Low-e 0,01, giúp hạn chế bức xạ mặt trời, giảm hấp thụ và truyền nhiệt qua kính. Nhờ đó, công trình vẫn đảm bảo ánh sáng tự nhiên nhưng giảm áp lực cho hệ thống điều hòa, góp phần tiết kiệm điện năng và phù hợp với xu hướng kiến trúc xanh.
            - generic [ref=f15e155]:
              - img "Kính cản nhiệt (Low e) phủ lớp kim loại siêu mỏng có khả năng hạn chế khoảng 40% sự truyền nhiệt vào mùa hè, chống nóng hiệu quả, ổn định nhiệt độ trong nhà" [ref=f15e156]
              - paragraph [ref=f15e157]: Kính cản nhiệt (Low e) phủ lớp kim loại siêu mỏng có khả năng hạn chế khoảng 40% sự truyền nhiệt vào mùa hè, chống nóng hiệu quả, ổn định nhiệt độ trong nhà
            - heading [level=3] [ref=f15e158]:
              - strong [ref=f15e159]: 1.6. Tăng tính thẩm mỹ và linh hoạt trong thiết kế
            - paragraph [ref=f15e160]: Bên cạnh kính cường lực, kính bán cường lực và hộp kính, Eurowindow còn cung cấp nhiều dòng kính như kính hoa văn, kính an toàn, kính phản quang, kính phủ cứng, phủ mềm. Sự đa dạng này giúp kiến trúc sư và chủ đầu tư dễ dàng lựa chọn loại kính phù hợp với từng không gian, từ khu vực cần sự trong suốt, mở rộng tầm nhìn đến khu vực cần tính riêng tư hoặc điểm nhấn trang trí.
            - heading [level=2] [ref=f15e161]:
              - strong [ref=f15e162]: 2. Điểm đặc biệt trong công nghệ gia công kính của Eurowindow
            - heading [level=3] [ref=f15e163]:
              - strong [ref=f15e164]: 2.1. Quy trình gia công kính được tổ chức đồng bộ trong một trung tâm chuyên biệt
            - paragraph [ref=f15e165]: Thay vì phụ thuộc vào nhiều đơn vị gia công, các công đoạn như cắt kính, mài cạnh, khoan lỗ, gia công CNC, tôi kính, sản xuất kính dán an toàn và hộp kính đều được thực hiện trong cùng một hệ thống. Cách tổ chức này giúp Eurowindow kiểm soát tốt hơn độ chính xác của từng chi tiết, hạn chế sai lệch trong quá trình gia công và đảm bảo sự đồng bộ giữa các sản phẩm kính khi lắp đặt vào công trình.
            - generic [ref=f15e166]:
              - img "Trung tâm sản xuất kính chuyên biệt của Eurowindow tại Mê Linh, Hà Nội" [ref=f15e167]
              - paragraph [ref=f15e168]: Trung tâm sản xuất kính chuyên biệt của Eurowindow tại Mê Linh, Hà Nội
            - heading [level=3] [ref=f15e169]:
              - strong [ref=f15e170]: 2.2. Hệ thống máy móc nhập khẩu giúp xử lý nhiều yêu cầu kính phức tạp
            - paragraph [ref=f15e171]: "Eurowindow sử dụng dây chuyền và thiết bị máy móc nhập khẩu từ các quốc gia có thế mạnh về công nghệ kính như Italia, Phần Lan, Thụy Sĩ và Đức. Hệ thống gồm: máy cắt kính khổ lớn, máy mài song cạnh, máy khoan, máy gia công CNC và lò tôi kính phẳng, cho phép xử lý nhiều dạng kính khác nhau với yêu cầu kỹ thuật cao."
            - paragraph [ref=f15e172]: Nhờ đó, các chi tiết kính có thể được gia công chính xác theo bản vẽ thiết kế, phù hợp với những công trình cần kích thước lớn, hình dạng đặc biệt hoặc yêu cầu lắp ghép phức tạp.
            - heading [level=3] [ref=f15e173]:
              - strong [ref=f15e174]: 2.3. Môi trường sản xuất được kiểm soát nhiệt độ và độ ẩm nghiêm ngặt
            - paragraph [ref=f15e175]: Các sản phẩm như hộp kính và kính an toàn được gia công trong phòng kín với yêu cầu cụ thể về độ ẩm và nhiệt độ. Việc duy trì môi trường ổn định giúp hạn chế hơi ẩm, bụi bẩn hoặc tạp chất ảnh hưởng đến chất lượng kính, đặc biệt với các sản phẩm có cấu tạo nhiều lớp hoặc cần độ kín khít cao như hộp kính và kính dán an toàn.
            - generic [ref=f15e176]:
              - img "Môi trường sản xuất kính của Eurowindow luôn được kiểm soát chặt chẽ nhiệt độ và độ ẩm" [ref=f15e177]
              - paragraph [ref=f15e178]: Môi trường sản xuất kính của Eurowindow luôn được kiểm soát chặt chẽ nhiệt độ và độ ẩm
            - heading [level=3] [ref=f15e179]:
              - strong [ref=f15e180]: 2.4. Ứng dụng kiểm tra Heat-Soak-Test để sàng lọc kính sau tôi
            - paragraph [ref=f15e181]: Sau quá trình tôi kính, Eurowindow sử dụng thiết bị Heat-Soak-Test để kiểm tra và loại bỏ các tấm kính có nguy cơ lỗi tiềm ẩn. Đây là bước kiểm soát quan trọng trong gia công kính cường lực, giúp phát hiện những sản phẩm không đạt yêu cầu trước khi đưa vào sử dụng thực tế.
            - paragraph [ref=f15e182]: Việc bổ sung công đoạn này cho thấy quy trình sản xuất không chỉ dừng ở gia công tạo hình, mà còn chú trọng kiểm tra chất lượng sau xử lý nhiệt.
            - heading [level=3] [ref=f15e183]:
              - strong [ref=f15e184]: 2.5. Khả năng tôi kính phủ mềm Low-E đòi hỏi kỹ thuật cao
            - paragraph [ref=f15e185]: Eurowindow ứng dụng công nghệ tôi kính Super Soft Coating Low-E 0,01, một dòng kính phủ mềm có yêu cầu gia công phức tạp hơn kính thông thường. Với loại kính này, lớp phủ cần được bảo vệ trong suốt quá trình cắt, tôi và xử lý bề mặt để không làm ảnh hưởng đến hiệu suất kỹ thuật của kính.
            - paragraph [ref=f15e186]: Khả năng gia công được kính phủ mềm Low-E cho thấy năng lực kiểm soát nhiệt, thiết bị và quy trình sản xuất ở mức cao, phù hợp với các công trình cần giải pháp kính tiết kiệm năng lượng.
            - heading [level=3] [ref=f15e187]:
              - strong [ref=f15e188]: 2.6. Chủ động sản xuất nhiều dòng kính trong cùng một hệ thống
            - paragraph [ref=f15e189]: Trung tâm kính Eurowindow có khả năng sản xuất đa dạng dòng kính như kính cường lực, kính bán cường lực, kính dán an toàn, hộp kính khổ lớn, kính hoa văn và các loại kính phủ. Việc chủ động nhiều dây chuyền trong cùng một trung tâm giúp Eurowindow đáp ứng linh hoạt các yêu cầu từ cửa, vách ngăn, mặt dựng đến hạng mục trang trí, đồng thời đảm bảo sự đồng bộ về chất lượng và tiến độ cho từng công trình.
            - generic [ref=f15e190]:
              - img "Kính Eurowindow đáp ứng linh hoạt các yêu cầu của mọi hạng mục công trình" [ref=f15e191]
              - paragraph [ref=f15e192]: Kính Eurowindow đáp ứng linh hoạt các yêu cầu của mọi hạng mục công trình
            - heading [level=2] [ref=f15e193]:
              - strong [ref=f15e194]: 3. Các dòng sản phẩm kính cao cấp của Eurowindow
            - paragraph [ref=f15e195]: Eurowindow cung cấp 5 dòng kính chính, mỗi dòng được tối ưu cho một nhóm công năng và vị trí lắp đặt khác nhau.
            - heading [level=3] [ref=f15e196]:
              - strong [ref=f15e197]: 3.1. Kính cường lực và bán cường lực
            - paragraph [ref=f15e198]: Đây là các dòng kính được xử lý nhiệt để tăng khả năng chịu lực, chống va đập, chống rung và chịu sốc nhiệt tốt hơn kính thường.
            - list [ref=f15e199]:
              - listitem [level=1] [ref=f15e200]:
                - strong [ref=f15e201]: Kính cường lực
                - text: có độ bền gấp 4 - 5 lần kính thường, khi vỡ tạo thành mảnh nhỏ ít sắc cạnh
              - listitem [level=1] [ref=f15e202]:
                - strong [ref=f15e203]: Kính bán cường lực
                - text: có độ cứng gấp 2 - 3 lần, khi vỡ nứt theo đường lượn sóng và vẫn giữ độ dẻo nhất định.
            - paragraph [ref=f15e204]: Nhờ độ an toàn và khả năng chịu lực cao, hai dòng kính này phù hợp cho vách kính lớn, mặt dựng, vách ngăn, cửa thủy lực, lan can, cửa sổ, cửa đi, bàn kính, buồng tắm kính và nhiều hạng mục nội thất.
            - generic [ref=f15e205]:
              - img "Kính cường lực và bán cường lực Eurowindow" [ref=f15e206]
              - paragraph [ref=f15e207]: Kính cường lực và bán cường lực Eurowindow
            - paragraph [ref=f15e208]:
              - link "XEM SẢN PHẨM" [ref=f15e210] [cursor=pointer]:
                - /url: https://eurowindow.biz/san-pham-kinh/kinh-cuong-luc-va-ban-cuong-luc.html
            - heading [level=3] [ref=f15e211]:
              - strong [ref=f15e212]: 3.2. Kính an toàn
            - paragraph [ref=f15e213]: Kính an toàn Eurowindow là dòng kính dán nhiều lớp, liên kết bằng màng phim PVB giúp tăng độ bền, độ trong suốt và giữ mảnh kính khi xảy ra va đập. Sản phẩm có khả năng chịu lực tốt, hạn chế xâm nhập từ bên ngoài, giảm nguy cơ gây nguy hiểm, đồng thời hỗ trợ cách âm, cách nhiệt và loại trừ phần lớn tia cực tím.
            - paragraph [ref=f15e214]: Kính phù hợp cho cửa sổ, cửa đi tại tòa nhà cao tầng, công trình gần đường lớn, nhà máy, sân bay, phòng thu âm hoặc các khu vực cần tăng độ an toàn và sự yên tĩnh.
            - generic [ref=f15e215]:
              - img "Kính an toàn của Eurowindow" [ref=f15e216]
              - paragraph [ref=f15e217]: Kính an toàn của Eurowindow
            - paragraph [ref=f15e218]:
              - link "XEM SẢN PHẨM" [ref=f15e220] [cursor=pointer]:
                - /url: https://eurowindow.biz/san-pham-kinh/kinh-an-toan.html
            - heading [level=3] [ref=f15e221]:
              - strong [ref=f15e222]: 3.3. Hộp kính và hộp kính khổ lớn
            - paragraph [ref=f15e223]: Hộp kính Eurowindow là giải pháp kính hiện đại cho cửa sổ, cửa đi, mặt dựng và công trình cao tầng cần diện tích kính lớn. Sản phẩm có kết cấu nhiều lớp với khoảng trống bơm khí Argon và hạt hút ẩm bên trong, giúp tăng khả năng cách âm, cách nhiệt, hạn chế ngưng tụ hơi nước.
            - paragraph [ref=f15e224]: Khi kết hợp với kính dán an toàn hoặc kính cường lực, hộp kính có khả năng chịu va đập tốt, đảm bảo độ chắc chắn, an toàn và mang lại vẻ đẹp hiện đại cho công trình.
            - generic [ref=f15e225]:
              - img "Hộp kính và hộp kính khổ lớn Eurowindow" [ref=f15e226]
              - paragraph [ref=f15e227]: Hộp kính và hộp kính khổ lớn Eurowindow
            - paragraph [ref=f15e228]:
              - link "XEM SẢN PHẨM" [ref=f15e230] [cursor=pointer]:
                - /url: https://eurowindow.biz/san-pham-kinh/hop-kinh-va-hop-kinh-kho-lon.html
            - heading [level=3] [ref=f15e231]:
              - strong [ref=f15e232]: 3.4. Kính cách nhiệt an toàn ACT
            - paragraph [ref=f15e233]: Kính cách nhiệt an toàn ACT Eurowindow là dòng kính đơn dán phim cách nhiệt, giúp tăng độ an toàn, giảm nhiệt truyền qua kính và hỗ trợ tiết kiệm điện năng. Sản phẩm có thể giảm tới 57% tổng năng lượng mặt trời, ngăn 75% ánh sáng gây chói và loại bỏ 99% tia cực tím, giúp không gian mát hơn, bảo vệ sức khỏe người dùng và hạn chế phai màu nội thất.
            - paragraph [ref=f15e234]: Khi kính bị va đập, lớp phim giúp giữ lại mảnh vỡ, giảm nguy cơ gây nguy hiểm, phù hợp cho nhà ở, văn phòng và các công trình cần kết hợp cách nhiệt với an toàn lâu dài.
            - generic [ref=f15e235]:
              - img "Kính cách nhiệt an toàn ACT Eurowindow" [ref=f15e236]
              - paragraph [ref=f15e237]: Kính cách nhiệt an toàn ACT Eurowindow
            - paragraph [ref=f15e238]:
              - link "XEM SẢN PHẨM" [ref=f15e240] [cursor=pointer]:
                - /url: https://eurowindow.biz/san-pham-kinh/kinh-cach-nhiet-an-toan-act.html
            - heading [level=3] [ref=f15e241]:
              - strong [ref=f15e242]: 3.5. Kính hoa văn
            - paragraph [ref=f15e243]: Kính hoa văn Eurowindow là dòng kính trang trí dành cho cửa sổ, cửa đi, mặt bàn kính và các hạng mục nội thất cần điểm nhấn thẩm mỹ. Sản phẩm được gia công bằng công nghệ khắc chìm CNC tự động trên dây chuyền máy móc nhập khẩu từ Italy, giúp tạo họa tiết chính xác và linh hoạt theo yêu cầu thiết kế.
            - paragraph [ref=f15e244]: Nhờ đó, kính hoa văn không chỉ làm đẹp không gian mà còn góp phần tăng giá trị nghệ thuật cho công trình.
