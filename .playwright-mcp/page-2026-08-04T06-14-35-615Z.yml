        - generic [ref=f15e81]:
          - paragraph [ref=f15e82]: Nhằm đáp ứng nhu cầu về kính của Eurowindow và cung cấp cho thị trường các loại kính cao cấp. Eurowindow đã đầu tư Trung tâm gia công kính tại lô 15 Khu công nghiệp Quang Minh, Mê Linh, Hà Nội với dây chuyền sản xuất hiện đại và đồng bộ hàng đầu tại Việt Nam.
          - paragraph [ref=f15e83]: "Một số sản phẩm kính tiêu biểu như: kính cường lực, kính bán cường lực, hộp kính khổ lớn, kính hoa văn, kính dán an toàn. Các sản phẩm được sử dụng làm vách kính lớn, vách ngăn, cửa thủy lực, lan can cầu thang, cửa sổ, cửa đi, cửa xe ô tô, bàn kính, buồng tắm kính,…"
          - paragraph [ref=f15e84]: Với tính an toàn, chịu lực cơ học cao, tính thẩm mỹ, có khả năng loại trừ tia cực tím, tính cách âm, cách nhiệt, sản phẩm kính của Eurowindow là sự lựa chọn hoàn hảo cho các dự án, công trình xây dựng dân dụng và công nghiệp.
