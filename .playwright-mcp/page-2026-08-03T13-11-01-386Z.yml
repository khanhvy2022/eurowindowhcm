          - paragraph [ref=f34e73]: Tòa nhà văn phòng Chính phủ
          - paragraph [ref=f34e75]: Công trình Tòa nhà văn phòng Chính phủ có ý nghĩa quan trọng, biểu tượng cho cơ quan cao nhất của Chính phủ trong giai đoạn phát triển đổi mới.
          - paragraph [ref=f34e78]: "Công trình có quy mô 9 tầng nổi và 3 tầng hầm, được thiết kế theo phong cách bán cổ điển, đề cao tính an toàn, tiện nghi ở các khu vực: phòng họp, hội trường, phòng tiếp khách… Eurowindow đã thi công các hạng mục: cửa sổ và vách nhôm kính lớn mặt dựng, cửa gỗ, mái kính Skylight và lam nhôm trên mái, cửa thép chống cháy, cửa nhôm chống cháy và vách kính hoa văn trong nhà…"
