        - generic [ref=e199]:
          - generic [ref=e200]:
            - paragraph [ref=e201]: "Dòng sản phẩm cửa uPVC của Eurowindow chủ yếu là cửa sổ, cửa đi, vách ngăn phù hợp với công trình như: khách sạn, biệt thự, chung cư - căn hộ. Cửa uPVC của Eurowindow được cấu tạo bởi thanh profile uPVC có cấu trúc dạng hộp, lắp lõi thép gia cường, hệ phụ kiện đồng bộ với chốt đa điểm, bản lề 3D có tác dụng giúp đóng mở đa chiều, khóa chuyên dụng, kết hợp với hệ gioăng kép đảm bảo độ kín khít và hộp kính được bơm khí trơ có tác dụng làm giảm sự truyền âm, truyền nhiệt. Ngoài ra, vật liệu uPVC cao cấp Có đặc tính nổi trội là không bị ôxy hóa hay ố vàng trong điều kiện bức xạ mặt trời. Những điều kiện này giúp cửa Eurowindow bao gồm cửa sổ nhựa uPVC, cửa đi, vách ngăn của Eurowindow có đặc tính cách âm, cách nhiệt cao, giúp tiết kiệm điện năng, tiết kiệm chi phí bảo dưỡng, sửa chữa, đem lại hiệu quả kinh tế lâu dài cho người sử dụng. Sản phẩm cửa uPVC có độ bền áp lực gió, độ kín nước, độ bền góc hàn thanh profile, cách âm theo TCVN7451:2004 và 7452-2:2004."
            - paragraph [ref=e202]
            - heading [level=1] [ref=e203]:
              - strong [ref=e204]: TÍNH ƯU VIỆT CỦA SẢN PHẨM CỬA TỪ uPVC CỦA EUROWINDOW
            - heading [level=2] [ref=e205]:
              - strong [ref=e206]: TÍNH CÁCH ÂM, CÁCH NHIỆT CỬA SỔ uPVC, CỬA ĐI, VÁCH NGĂN
            - paragraph [ref=e207]:
              - strong [ref=e208]:
                - emphasis [ref=e209]: Cửa uPVC của Eurowindow mang lại cho bạn cảm giác thực sự dễ chịu trong một không gian yên tĩnh và ấm áp
            - paragraph [ref=e210]: "Cửa Eurowindow là tập hợp đồng bộ của các linh kiện như khung cửa định hình, hộp kính, gioăng... được thiết kế nhằm mục đích đạt hiệu quả cách âm, cách nhiệt cao nhất. Ví dụ: Căn phòng nằm sát trục đường giao thông, nơi có cường độ tiếng ồn bên ngoài lên đến 85 dB, song nhà cửa sổ uPVC có độ cách âm tốt nên cường độ tiếng ồn trong phòng chỉ còn khoảng 40 - 45 dB."
            - paragraph [ref=e211]: "Vài ví dụ về tiếng ồn:"
            - list [ref=e212]:
              - listitem [ref=e213]: "Tiếng lật sách: 20 dB."
              - listitem [ref=e214]: "Cuộc nói chuyện bình thường: 50 dB."
              - listitem [ref=e215]: "Âm thanh trên đường giao thông: 85 - 95 dB."
            - paragraph [ref=e216]: Đi kèm với khả năng cách âm giúp nâng cao chất lượng cuộc sống, cửa nhựa Eurowindow bao gồm cửa sổ nhựa uPVC, cửa đi, vách ngăn còn có khả năng cách nhiệt gấp từ 2 - 4 lần so với các loại cửa thông thường, giúp tiết kiệm điện năng sưởi ấm và làm mát căn phòng, mang lại hiệu quả kinh tế cao cho người sử dụng.
            - paragraph [ref=e217]
            - heading [level=2] [ref=e218]:
              - strong [ref=e219]: HIỆU QUẢ KINH TẾ CAO KHI SỬ DỤNG CỬA TỪ uPVC CỦA EUROWINDOW
            - paragraph [ref=e220]:
              - strong [ref=e221]:
                - emphasis [ref=e222]: Tiết kiệm điện năng, bền, ít phải sơn sửa, bảo dưỡng định kỳ
            - paragraph [ref=e223]: "Trong thiết kế xây dựng, ngân sách dành cho cửa gỗ chiếm phần không nhỏ trong tổng chi phí vật liệu. Với ngân sách này hoàn toàn có thể lựa chọn phương án cửa làm từ vật liệu uPVC cao cấp với những ưu điểm mà cửa gỗ cũng như cửa nhôm thông thường không thể sánh được: cách âm, cách nhiệt, không đòi hỏi tu bổ định kỳ, duy trì chất lượng sử dụng cao trong thời gian hàng chục năm... Hơn thế nữa, cửa nhựa windows từ uPVC bao gồm cửa sổ nhựa upvc, cửa đi, vách ngăn giúp hạn chế sự truyền nhiệt, điều đó đồng nghĩa với việc tiết kiệm điện năng để làm mát hoặc sưởi ấm căn phòng. Chỉ sau vài năm sử dụng, cửa uPVC sẽ khấu hao toàn bộ chi phí đầu tư ban đầu."
            - paragraph [ref=e224]: So với một số loại cửa thông thường, chi phí đầu tư ban đầu cho cửa uPVC cao hơn, song theo thời gian, hiệu quả kinh tế nhờ tiết kiệm chi phí phát sinh trong quá trình sử dụng mà cửa uPVC đem lại sẽ ngày càng được thể hiện rõ rệt hơn.
            - paragraph [ref=e225]: Những ưu điểm riêng khác như tính tiện dụng của bộ phụ kiện kim khí, cánh cửa đóng khít và ổn định, cửa không cong vênh hoặc CO giãn, bề mặt khung cửa giữ màu sắc tươi... cũng là những luận cứ khách quan khẳng định tính kinh tế trước mắt cũng như lâu dài của việc lựa chọn cửa sổ nhựa uPVC từ thanh profile định hình uPVC.
            - paragraph [ref=e226]
            - heading [level=2] [ref=e227]:
              - strong [ref=e228]: CỬA NHỰA CÓ TÍNH ỔN ĐỊNH CAO, KHÔNG CONG VÊNH, CO NGÓT
            - paragraph [ref=e229]:
              - strong [ref=e230]:
                - emphasis [ref=e231]: Ổn định vượt trội so với các loại cửa truyền thống
            - paragraph [ref=e232]: Khác với sản phẩm cửa gỗ thông thường hay bị cong vênh, co ngót trong điều kiện khí hậu nhiệt đới của Việt Nam, sản phẩm cửa nhựa từ uPVC của Eurowindow luôn giữ được độ chuẩn xác của cấu trúc và vẻ đẹp ban đầu trong suốt thời gian sử dụng. Sự ăn khớp giữa khuôn và cánh cửa luôn đảm bảo độ kín, khít, giữ nhiệt cho căn phòng của bạn ấm về mùa đông và mát về mùa hè.
            - paragraph [ref=e233]
            - heading [level=2] [ref=e234]:
              - strong [ref=e235]: CỬA NHỰA PHÙ HỢP VỚI CÁC ĐIỀU KIỆN KHÍ HẬU VIỆT NAM
            - paragraph [ref=e236]:
              - strong [ref=e237]:
                - emphasis [ref=e238]: Luôn bền bỉ trước khí hậu nhiệt đới nóng, ẩm, mưa nhiều
            - paragraph [ref=e239]: Đặc tính quý báu nổi bật của vật liệu uPVC là tuổi thọ rất cao do vật liệu này không bị ôxy hóa, không bị lão hóa hay ố vàng trong điều kiện bức xạ mặt trời và khí hậu nhiệt đới (nóng, ẩm, mưa nhiều).
            - paragraph [ref=e240]: Việc sử dụng các chất phụ gia (Additives) và chất ổn định (Stabilizers) trong công thức phối liệu đã tạo ra sự thích ứng của vật liệu trong điều kiện nhiệt độ và độ ẩm cao.
            - paragraph [ref=e241]: "Điều này đã được chứng minh bằng sự phát triển rất nhanh chóng của loại vật liệu uPVC tại các nước Châu Á như: Trung Quốc, Singapore, Malaysia, Thái Lan..."
            - paragraph [ref=e242]
            - heading [level=2] [ref=e243]:
              - strong [ref=e244]: CỬA NHỰA CÓ TÍNH AN TOÀN CHÁY
            - paragraph [ref=e245]:
              - strong [ref=e246]:
                - emphasis [ref=e247]: Giảm thiểu tối đa sự lan truyền ngọn lửa khi gặp biến cố hỏa hoạn, cháy nổ
            - paragraph [ref=e248]: Kiến trúc và phân bố nhà không theo quy hoạch thống nhất là đặc thù của đô thị Việt Nam. Thực tế đó đã gây nên tình trạng bất lợi đối với công tác phòng cháy và chữa cháy. Do vậy, vấn đề lựa chọn vật liệu xây dựng chống cháy là yêu cầu và cũng là mục tiêu cần phải đạt được. Góp phần vào việc thực hiện mục tiêu đó, cửa nhựa từ uPVC của Eurowindow bao gồm cửa sổ nhựa upvc, cửa đi, vách ngăn được sản xuất bằng vật liệu polymer và phụ gia chống cháy, không bị phân huỷ thành các thành phần dễ cháy khác ngay cả trong điều kiện nhiệt độ cao.
            - paragraph [ref=e249]: Với nhiệt độ gần 100°C của đèn khò, thanh uPVC chỉ biến dạng mà không bén cháy, loại bỏ hẳn quá trình ngọn lửa phát tán qua cửa.
            - paragraph [ref=e250]
            - heading [level=1] [ref=e251]:
              - strong [ref=e252]: CHI TIẾT VÀ TÍNH NĂNG CÁC BỘ PHẬN CẤU THÀNH CỬA SỔ, CỬA ĐI, VÁCH NGĂN uPVC
            - heading [level=2] [ref=e253]:
              - strong [ref=e254]: THANH PROFILE
            - paragraph [ref=e255]:
              - strong [ref=e256]:
                - emphasis [ref=e257]: Thanh profile có cấu trúc dạng hộp với lõi thép gia cường làm tăng khả năng chịu lực và tính cách âm, cách nhiệt.
            - paragraph [ref=e258]: Thanh profile định hình từ uPVC có cấu trúc dạng hộp, được chia thành nhiều khoang trống có chức năng cách âm, cách nhiệt, được lắp lõi thép gia cường để tăng khả năng chịu lực cho bộ cửa.
            - paragraph [ref=e259]: "uPVC khác với các loại nhựa thông thường, uPVC là Polyvinyl Chloride cứng được biến tính bởi các thành phần: Acrylic Polymers tạo cho nhựa bền chắc, chịu được va đập mạnh; các chất ổn định giúp nhựa chịu được tác động của nhiệt và tia cực tím; sáp dùng trong quá trình chế biến tạo cho thanh profile có bề mặt bóng, đẹp."
            - paragraph [ref=e260]: Eurowindow sử dụng các thanh profile định hình từ uPVC của hãng Koemmerling thuộc tập đoàn Profine (CHLB Đức) với uy tín trên 100 năm hoạt động và là nhà sản xuất, cung cấp thanh profile hàng đầu thế giới. Hiện nay, Eurowindow là nhà cung cấp độc quyền profile Koemmerling tại Việt Nam.
            - paragraph [ref=e261]
            - heading [level=2] [ref=e262]:
