        - generic [ref=e151]:
          - generic [ref=e152]:
            - paragraph [ref=e153]:
              - strong [ref=e154]: "Đặc điểm:"
            - list [ref=e155]:
              - listitem [level=1] [ref=e156]: Tùy theo thiết kế của công trình, vách nhôm kính lớn thông tầng được sử dụng cho nhà cao tầng có hoặc không có nan nhôm trang trí ở mặt ngoài.
              - listitem [level=1] [ref=e157]: Cách âm, cách nhiệt, bảo đảm ánh sáng tự nhiên.
              - listitem [level=1] [ref=e158]: Đa dạng kiểu dáng, phù hợp với nhiều dạng kiến trúc.
              - listitem [level=1] [ref=e159]: Phù hợp tiêu chuẩn Châu Âu về khả năng cách âm, cách nhiệt, độ kín khít.
              - listitem [level=1] [ref=e160]: Sử dụng trong thiết kế các tòa nhà có kiến trúc dạng hi-tech.
              - listitem [level=1] [ref=e161]: Thi công đơn giản và gọn nhẹ.
              - listitem [level=1] [ref=e162]: Tải trọng nhẹ, khả năng chịu lực tốt và độ bền cao.
              - listitem [level=1] [ref=e163]: Kinh tế trong sử dụng.
              - listitem [level=1] [ref=e164]: Tính thẩm mỹ cao.
            - paragraph [ref=e165]:
              - strong [ref=e166]: "Vật liệu:"
            - list [ref=e167]:
              - listitem [level=1] [ref=e168]: Thanh profile được ép đùn từ hợp kim nhôm cao cấp, đạt tiêu chuẩn Châu Âu.
              - listitem [level=1] [ref=e169]: "Kính: kính đơn, kính an toàn, kính cường lực, kính bán cường lực, kính hoa văn, hộp kính (được bơm khí trơ cách âm, cách nhiệt)."
              - listitem [level=1] [ref=e170]: Hệ gioăng làm từ vật liệu EPDM chống lão hóa, đảm bảo độ kín khít.
            - paragraph [ref=e171]:
              - strong [ref=e172]: "Các loại bề mặt cửa vách nhôm kính lớn:"
            - list [ref=e173]:
              - listitem [level=1] [ref=e174]: "Vách nhôm kính lớn nẹp ngoài (nẹp ngang và nẹp dọc): Kết cấu này có ưu điểm tạo vẻ ngoài chắc chắn cho công trình. Với công nghệ sơn nhôm của Eurowindow, khách hàng có nhiều lựa chọn các gam màu khác nhau cho các thanh nẹp ngoài, từ đó tạo vẻ đẹp cho toàn bộ công trình."
              - listitem [level=1] [ref=e175]: "Vách nhôm kính lớn kết hợp giữa có nan nhôm hoặc không có nan nhôm trang trí: Kết cấu này sẽ tạo điểm nhấn bằng những đường kẻ dọc hoặc kẻ ngang trên bề mặt ngoài của toàn bộ công trình. Việc kết hợp giữa các nẹp ngang với nẹp dọc sẽ tạo ra nét độc đáo mang tính thẩm mỹ cao."
              - listitem [level=1] [ref=e176]: "Vách nhôm kính lớn không nan nhôm trang trí mặt ngoài: Kết cấu này có ưu điểm nổi trội là tạo nên bề mặt phẳng đồng nhất bên ngoài của công trình và có cảm giác như một tấm kính khổng lồ khi nhìn từ bên ngoài. Điều này không chỉ thuận lợi trong việc trang trí những ô kính có màu sắc khác nhau mà còn phù hợp để làm màn hình quảng cáo điện tử lớn."
            - paragraph [ref=e177]:
              - strong [ref=e178]: "Vách nhôm kính lớn được chia làm hai hệ chính:"
            - list [ref=e179]:
              - listitem [level=1] [ref=e180]: Hệ stick.
              - listitem [level=1] [ref=e181]: Hệ Unitized.
            - paragraph [ref=e182]:
