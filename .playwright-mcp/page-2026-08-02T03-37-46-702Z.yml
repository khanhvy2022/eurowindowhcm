        - paragraph [ref=f28e32]: Dịch vụ · Quy trình 4 bước
        - heading "Chọn đúng giải pháp, hoàn thiện đúng chuẩn." [level=1] [ref=f28e33]
        - paragraph [ref=f28e34]: Eurowindow đồng hành cùng khách hàng từ tư vấn, thiết kế đến triển khai và chăm sóc sau bàn giao — theo một quy trình rõ ràng, có thể theo dõi ở từng bước.
      - list [ref=f28e36]:
        - listitem [ref=f28e37]:
          - paragraph [ref=f28e38]: "1.0"
          - heading "Tư vấn giải pháp" [level=2] [ref=f28e39]
          - paragraph [ref=f28e40]: Phân tích công năng, điều kiện công trình và nhu cầu sử dụng để lựa chọn hệ sản phẩm phù hợp. Chúng tôi lắng nghe trước, đề xuất sau.
        - listitem [ref=f28e41]:
          - paragraph [ref=f28e42]: "2.0"
          - heading "Thiết kế & triển khai" [level=2] [ref=f28e43]
          - paragraph [ref=f28e44]: Phối hợp với kiến trúc sư, chủ đầu tư và đội ngũ thi công — từ ý tưởng đến hồ sơ kỹ thuật, khớp nối đúng chuẩn công trình.
        - listitem [ref=f28e45]:
          - paragraph [ref=f28e46]: "3.0"
          - heading "Sản xuất & thi công" [level=2] [ref=f28e47]
          - paragraph [ref=f28e48]: Sản xuất theo hệ chuẩn, lắp đặt bởi đội ngũ kinh nghiệm, kiểm tra nghiệm thu từng hạng mục trước khi bàn giao.
        - listitem [ref=f28e49]:
          - paragraph [ref=f28e50]: "4.0"
          - heading "Bảo hành & chăm sóc" [level=2] [ref=f28e51]
          - paragraph [ref=f28e52]: Đồng hành sau bàn giao với quy trình hỗ trợ rõ ràng và dịch vụ bảo hành theo chính sách sản phẩm.
