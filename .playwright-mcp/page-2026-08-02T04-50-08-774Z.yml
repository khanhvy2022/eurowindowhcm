            - paragraph [ref=f71e32]: Hệ cửa nhôm và vách nhôm kính lớn từ vật liệu nhôm EA55–EA95i, phụ kiện chính hãng Cmech, Roto, Hafele. Độ kín khít cao, đóng mở đa chiều đáp ứng những yêu cầu khắt khe về thiết kế, chịu tải trọng gió lớn cho công trình quy mô.
