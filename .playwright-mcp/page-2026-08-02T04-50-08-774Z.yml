            - generic [ref=f71e58]:
              - paragraph [ref=f71e59]: Giới thiệu sản phẩm
              - generic [ref=f71e60]:
                - paragraph [ref=f71e61]: Cửa nhôm và vách nhôm kính lớn Eurowindow được sản xuất từ vật liệu nhôm cao cấp, khắc phục triệt để những nhược điểm của nhôm thông thường như kết cấu yếu, phụ kiện đơn giản, không có cầu cách nhiệt nên khả năng cách âm, cách nhiệt kém, hay bị rò rỉ nước mưa.
                - paragraph [ref=f71e62]: Cửa nhôm (gồm cửa sổ, cửa đi) và cửa vách nhôm đảm bảo độ kín khít cao, có thể đóng mở đa chiều, phù hợp với nhiều kiểu phong cách kiến trúc. Đặc biệt, profile nhôm có cầu cách nhiệt kết hợp với hộp kính bơm khí trơ giúp hạn chế tối đa sự truyền nhiệt, góp phần tiết kiệm điện năng. Bên cạnh hợp tác chiến lược với các nhà cung cấp profile nhôm hàng đầu thế giới như Technal (Pháp), Shueco (CHLB Đức), Eurowindow còn đầu tư dây chuyền sơn tĩnh điện (Powdercoating) và sơn nước (PVDF), cho phép sơn tấm nhôm gấp khổ lớn tới 2,5m x 2,5m x 6m, cùng hệ thống xử lý nước thải đạt chuẩn A Grade.
            - generic [ref=f71e63]:
              - paragraph [ref=f71e64]: Chi tiết cấu tạo & công nghệ
              - generic [ref=f71e65]:
                - generic [ref=f71e66]:
                  - heading "Thanh profile" [level=3] [ref=f71e67]
                  - paragraph [ref=f71e68]: Thanh profile có cầu cách nhiệt hoặc không, với các khoang rỗng và gân tăng cứng, rãnh và vách kỹ thuật được tính toán kỹ lưỡng tạo sống gia cường, kênh thoát nước và khoang trống cách âm, cách nhiệt.
                - generic [ref=f71e69]:
                  - heading "Hộp kính" [level=3] [ref=f71e70]
                  - paragraph [ref=f71e71]: Kết hợp hộp kính bơm khí trơ, hệ gioăng EPDM và hệ phụ kiện kim khí đồng bộ để đạt hiệu quả cách âm, cách nhiệt cao.
                - generic [ref=f71e72]:
                  - heading "Hệ phụ kiện" [level=3] [ref=f71e73]
                  - paragraph [ref=f71e74]: Phụ kiện kim khí chính hãng Cmech, Roto, Hafele, Huy Hoàng, GMT, Kinlong tạo sự chính xác và an toàn trong sử dụng.
          - generic [ref=f71e75]:
            - paragraph [ref=f71e76]: Tính năng & ưu việt
            - generic [ref=f71e77]:
              - generic [ref=f71e78]:
                - heading "Cách âm, cách nhiệt" [level=3] [ref=f71e79]
                - paragraph [ref=f71e82]: Profile nhôm có cầu cách nhiệt kết hợp hộp kính, gioăng EPDM và phụ kiện đồng bộ đem lại tính cách âm, cách nhiệt cao — đặc biệt với dòng có cầu cách nhiệt.
              - generic [ref=f71e83]:
                - heading "Chịu lực tốt" [level=3] [ref=f71e84]
                - paragraph [ref=f71e87]: Thanh profile thiết kế khoang rỗng, gân tăng cứng và chiều dày nhôm hợp lý giúp chịu tác động từ gió, bão, động đất.
              - generic [ref=f71e88]:
