        - generic [ref=e61]:
          - generic [ref=e63]:
            - heading "THỂ LỆ CHƯƠNG TRÌNH KHUYẾN MÃI “ĐẦU TƯ XỨNG TẦM – ƯU ĐÃI CỰC PHẨM”" [level=1] [ref=e65]
            - generic [ref=e66]:
              - generic [ref=e67]: 18/06/2025
              - link "Tin khuyến mãi" [ref=e70] [cursor=pointer]:
                - /url: https://eurowindow.biz/tin-tuc/tin-khuyen-mai
              - generic [ref=e73]: 54668 Lượt xem
            - generic [ref=e77]:
              - paragraph [ref=e78]:
                - emphasis [ref=e79]: Tri ân khách hàng, Eurowindow triển khai chương trình khuyến mãi “Đầu tư xứng tầm – Ưu đãi cực phẩm”, áp dụng dành riêng cho các khách hàng mua sản phẩm lắp đặt cho công trình nhà riêng từ Quảng Bình trở vào khu vực miền Nam. Chương trình diễn ra từ ngày 16/6 đến hết ngày 31/7/2025 với nhiều ưu đãi hấp dẫn.
              - paragraph [ref=e80]: Cụ thể, khách hàng ký hợp đồng/phụ lục hợp đồng (HĐ/PLHĐ) mua sản phẩm bất kỳ của Eurowindow trong thời gian diễn ra khuyến mãi sẽ được ưu đãi ngay 12% giá trị hợp đồng (trước VAT).Bên cạnh đó, Eurowindow ưu đãi giảm thêm 2% khi khách hàng thanh toán đủ 100% giá trị hợp đồng ngay sau khi ký HĐ/PLHĐ. Nhân ba ưu đãi, các HĐ/PLHĐ có giá trị từ 500 triệu đồng trở lên được nhận thêm quà tặng hấp dẫn là robot hút bụi hơi nước Samsung trị giá 30 triệu đồng.
              - img "viber-image-2025-06-16-18-18-18-555" [ref=e82]
              - heading "THỂ LỆ CHƯƠNG TRÌNH KHUYẾN MÃI" [level=2] [ref=e83]
              - paragraph [ref=e84]:
                - strong [ref=e85]: "1. Tên chương trình: “Đầu tư xứng tầm – Ưu đãi cực phẩm”"
              - paragraph [ref=e86]:
                - strong [ref=e87]: "2. Hàng hóa dịch vụ dùng để khuyến mãi: Sản phẩm Eurowindow."
              - paragraph [ref=e88]:
                - strong [ref=e89]: "3. Thời gian khuyến mãi: Từ ngày 16/6/2025 đến hết ngày 31/07/2025."
              - paragraph [ref=e90]:
                - strong [ref=e91]: 4. Đối tượng và phạm vi khuyến mãi
              - paragraph [ref=e92]: Khách hàng ký HĐ/PLHĐ mua sản phẩm Eurowindow lắp đặt cho công trình nhà riêng từ Quảng Bình trở vào khu vực miền Nam.
              - paragraph [ref=e93]:
                - strong [ref=e94]: "5. Chi tiết nội dung và thể lệ tham gia Chương trình khuyến mãi:"
              - paragraph [ref=e95]: "- Giảm giá sản phẩm: Giảm giá 12% trước VAT (bao gồm cả chi phí vận chuyển và lắp đặt) cho tất cả các sản phẩm."
              - paragraph [ref=e96]: "- Quà tặng: Các khách hàng ký hợp đồng mua hàng từ 500 triệu đồng trở lên sẽ nhận được 01 rô bốt hút bụi hơi nước của hãng Samsung trị giá 30.000.000 đồng hoặc sản phẩm hút bụi có giá trị tương đương, tặng ngay sau khi ký hợp đồng và khách hàng hoàn thành thủ tục thanh toán cọc theo CTKM."
              - paragraph [ref=e97]: "- Giảm thêm 2% khi khách hàng thanh toán 100% giá trị HĐ/PLHĐ ngay sau khi ký HĐ/PLHĐ (việc thanh toán 100% có thể áp dụng cho thanh toán nhiều lần miễn số tiền thanh toán đủ 100% và tuân theo thời hạn thanh toán tạm ứng của HĐ)."
              - paragraph [ref=e98]: "- Khuyến mãi chỉ áp dụng cho các HĐ/PLHĐ ký trong thời gian khuyến mãi từ ngày 16/6/2025 đến ngày 31/07/2025, hoàn thành thủ tục đặt cọc tối thiểu 30% giá trị HĐ/PLHĐ đến hết ngày 09/08/2025. Nếu sau ngày 09/08/2025, khách hàng vẫn chưa hoàn tất thủ tục đặt cọc theo quy định thì sẽ không được tham gia chương trình khuyến mãi."
              - paragraph [ref=e99]:
                - strong [ref=e100]: "6. Các quy định khác:"
              - paragraph [ref=e101]: "- Chương trình khuyến mãi không áp dụng đồng thời với các chương trình khác của Eurowindow."
              - paragraph [ref=e102]: "- Quà tặng không quy đổi thành tiền mặt."
              - paragraph [ref=e103]: "- Trong trường hợp phát sinh tranh chấp, khiếu nại liên quan đến chương trình khuyến mãi, Công ty Cổ phần Eurowindow sẽ trực tiếp đứng ra giải quyết và quyết định của Công ty Cổ phần Eurowindow là quyết định cuối cùng."
              - paragraph [ref=e104]:
                - strong [ref=e105]: "7. Trách nhiệm thông báo:"
              - paragraph [ref=e106]: Công ty Cổ phần Eurowindow có trách nhiệm thông báo đầy đủ chi tiết nội dung của thể lệ chương trình khuyến mãi trên ít nhất 01 phương tiện thông tin đại chúng chính thức.
              - paragraph [ref=e107]:
                - strong [ref=e108]: "8. Liên hệ:"
              - paragraph [ref=e109]: "• Chi nhánh miền Trung: 152 Phan Đăng Lưu, Phường hòa Cường Bắc, Quận Hải Châu, TP. Đà Nẵng. Hotline: 0906 000 111."
              - paragraph [ref=e110]: "• Chi nhánh miền Nam: Số 39 Bis Mạc Đĩnh Chi, Phường Đakao, Quận 1, TP. Hồ Chí Minh. Hotline miền Nam: 0903 11 8888."
              - paragraph [ref=e111]:
                - text: "Xem chi tiết thể lệ CTKM:"
                - link "TẠI ĐÂY" [ref=e112] [cursor=pointer]:
                  - /url: https://drive.google.com/file/d/1S5-nofPVl7gwiCWhRxfHnz1UMF7pHAaj/view?usp=drivesdk
