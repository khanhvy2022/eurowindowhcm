        - generic [ref=f11e303]:
          - generic [ref=f11e304]:
            - paragraph [ref=f11e305]:
              - strong [ref=f11e306]: GIỚI THIỆU CHUNG
            - paragraph [ref=f11e307]: "Sản phẩm cửa nhôm và cửa vách nhôm kính lớn được sản xuất từ vật liệu nhôm cao cấp, có khả năng khắc phục những nhược điểm của nhôm thông thường như: kết cấu yếu, phụ kiện đơn giản, không có cầu cách nhiệt nên khả năng cách âm, cách nhiệt kém, hay bị rò rỉ nước mưa."
            - paragraph [ref=f11e308]: Sản phẩm cửa nhôm (gồm cửa sổ, cửa đi) và cửa vách nhôm đảm bảo độ kín khít cao, có thể đóng mở đa chiều, đáp ứng những yêu cầu khắt khe về thiết kế, phù hợp với nhiều kiểu phong cách kiến trúc khác nhau. Đặc biệt, cửa và vách nhôm kính cao cấp Eurowindow sử dụng profile nhôm có cầu cách nhiệt kết hợp với hộp kính được bơm khí trơ, giúp hạn chế tối đa sự truyền nhiệt, góp phần tiết kiệm điện năng trong quá trình sử dụng.
            - paragraph [ref=f11e309]: "Bên cạnh hợp tác chiến lược với các nhà cung cấp profile nhôm hàng đầu thế giới như: Technal (Pháp), Shueco (CHLB Đức), các hãng cung cấp phụ kiện nổi tiếng trên toàn cầu, Eurowindow còn đầu tư hệ thống máy móc, dây chuyền thiết bị nhập khẩu đồng bộ để không ngừng nâng cao chất lượng sản phẩm cửa và vách nhôm kính."
            - paragraph [ref=f11e310]: Với dây chuyền phun sơn tự động sử dụng công nghệ sơn tĩnh điện tích hợp phương pháp sơn bột (Powdercoating) và sơn nước (PVDF), được đánh giá là hiện đại, đồng bộ nhất hiện nay, cho phép tạo ra những sản phẩm có màu sắc phong phú, độ bền cao, chống xước, không bị ăn mòn bởi hoá chất thông thường hay tác động của thời tiết, có thể sơn được những tấm nhôm và cấu kiện nhôm gấp khổ lớn tới 2,5m x 2,5m x 6m. Đặc biệt, với hệ thống xử lý nước thải hoàn toàn tự động nhập khẩu từ Singapore, nguồn nước thải từ nhà máy của Eurowindow được xử lý đạt mức “A Grade” - tiêu chuẩn cao nhất của Việt Nam về bảo vệ môi trường.
            - paragraph [ref=f11e311]: Dây chuyền gia công cơ khí để sản xuất tấm ốp nhôm của Eurowindow cho phép sản xuất ra các loại tấm ốp nhôm phức hợp (aluminium composite panel) và tấm ốp nhôm đặc (aluminium solid panel).
            - paragraph [ref=f11e312]: Trung tâm kính hiện đại bậc nhất cả nước chuyên sản xuất các sản phẩm như kính cường lực, kính bán cường lực, hộp kính khổ lớn, kính an toàn, kính hoa văn…
            - paragraph [ref=f11e313]: "Khép kín toàn bộ quy trình sản xuất, tuân thủ kiểm soát nghiêm ngặt từ khâu nguyên liệu đầu vào, gia công, sơn, lắp ráp, cho đến hoàn thiện sản phẩm, lắp đặt tại công trình, Eurowindow cung cấp các giải pháp tối ưu về sản phẩm cửa nhôm và hệ vách nhôm kính, góp phần hoàn thiện các công trình có kiến trúc dạng hi-tech, cần không gian rộng và tầm nhìn lớn như: các toà nhà cao ốc, văn phòng, trung tâm thương mại, trường học, bệnh viện…"
            - paragraph [ref=f11e314]: Đặc biệt, với những công trình đặc thù, Eurowindow có thể thiết kế chi tiết hệ thống mặt cắt để lắp dựng hệ vách nhôm kính lớn có kiến trúc phức tạp.
            - paragraph [ref=f11e315]:
              - strong [ref=f11e316]: TÍNH ƯU VIỆT CỦA CỬA NHÔM EUROWINDOW
            - paragraph [ref=f11e317]:
              - strong [ref=f11e318]: "CÁCH ÂM, CÁCH NHIỆT:"
              - text: Được làm từ profile nhôm (có cầu cách nhiệt hoặc không có cầu cách nhiệt) kết hợp với hộp kính, hệ gioăng EPDM và hệ phụ kiện kim khí đồng bộ, nên cửa nhôm và hệ vách nhôm kính lớn của Eurowindow có tính cách âm, cách nhiệt cao. Đặc biệt, profile nhôm có cầu cách nhiệt có tính cách âm, cách nhiệt cao hơn.
            - paragraph [ref=f11e319]:
              - strong [ref=f11e320]: "CHỊU LỰC TỐT:"
              - text: Các thanh profile được thiết kế hợp lý với các khoang rỗng và gân tăng cứng cũng như chiều dày nhôm, các rãnh, vách kỹ thuật trong cấu trúc thanh nhôm được tính toán kỹ lưỡng để tạo sống gia cường, kênh thoát nước, khoang trống cách âm, cách nhiệt. Với cấu tạo này, thanh profile nhôm có tính cách âm, cách nhiệt cao và nổi bật là chịu lực tốt. Đặc biệt, với hệ thống sản phẩm có cầu cách nhiệt thì các gân tăng cứng và khoang rỗng nhiều hơn nên khả năng chịu lực càng tốt hơn.
            - paragraph [ref=f11e321]:
              - strong [ref=f11e322]: "TẢI TRỌNG NHẸ:"
              - text: Do đặc điểm nhôm là vật liệu nhẹ, có độ bền cao, được thiết kế các khoang rỗng cùng với các sống gia cường hợp lý nên việc sử dụng vật liệu này sẽ giảm tải trọng của toàn bộ công trình hơn hẳn so với vách tường sử dụng các loại vật liệu khác. Profile nhôm đã được tính toán tải trọng an toàn cho khả năng chịu lực cao, chịu tác động từ gió, bão, động đất. Do đó, vật liệu này đem lại giải pháp an toàn tối ưu cho công trình.
            - paragraph [ref=f11e323]:
              - strong [ref=f11e324]: "KINH TẾ TRONG SỬ DỤNG:"
              - text: Với các tòa nhà cao tầng có nhiều diện tích vách tiếp xúc trực tiếp với ánh nắng mặt trời thì chi phí điện năng cho hệ thống điều hòa, thông gió nhằm ổn định điều kiện không khí trong tòa nhà rất lớn. Việc sử dụng cửa nhôm và vách nhôm kính lớn với hộp kính cách âm , cách nhiệt, kính an toàn… là giải pháp chính trong việc tiết kiệm điện năng. Profile nhôm đã được xử lý bề mặt và sơn tĩnh điện với công nghệ tiên tiến sẽ có độ bền cao, luôn giữ được màu sắc và cấu trúc của cửa ngay trong cả điều kiện thời tiết khắc nghiệt. Hơn nữa, cửa nhôm hoặc vách nhôm kính lớn còn thuận tiện cho gia chủ trong việc bảo quản vì chỉ cần lau chùi bình thường là sáng đẹp như mới mà không cần phải tu bổ, bảo dưỡng định kỳ.
            - paragraph [ref=f11e325]:
              - strong [ref=f11e326]: "TÍNH THẨM MỸ:"
              - text: Cửa nhôm và vách nhôm kính lớn giúp nối và sử dụng được không gian, tạo tầm nhìn bao quát cho cả căn phòng và cảm giác gần gũi với thiên nhiên. Hệ vách nhôm kính lớn có kết cấu giấu đố chịu lực chính bên trong nên vách kính có mặt phẳng lớn mà không bị lộ đố ra ngoài . Không chỉ được làm từ kính thông thường, cửa nhôm hay vách nhôm kính lớn còn sử dụng nhiều loại kính trang trí như kính màu, kính hoa văn, kính mài mờ… vừa đảm bảo yêu cầu kín đáo, vừa có tính thẩm mỹ cao.
            - paragraph [ref=f11e327]:
              - strong [ref=f11e328]: "THỎA MÃN CÁC TIÊU CHUẨN:"
              - text: "Sản phẩm cửa nhôm, hệ vách nhôm kính lớn do Eurowindow cung cấp không chỉ đạt các tiêu chuẩn chất lượng của Châu Âu mà còn phù hợp với các tiêu chuẩn Việt nam (TCVN) như: TCVN 330:2004 (hợp kim nhôm định hình); TCVN 7452-1:2004 (độ lọt khí); TCVN 7452-2:2004 (độ kín nước); TCVN 7452-3:2004 (độ chịu áp lực gió); ISO 140-5 (khả năng cách âm)."
