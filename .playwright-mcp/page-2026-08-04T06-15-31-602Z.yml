        - generic [ref=f18e113]:
          - generic [ref=f18e114]:
            - heading "1. Các dòng sản phẩm cửa tự động của Eurowindow" [level=2] [ref=f18e115]
            - paragraph [ref=f18e116]: Eurowindow hiện cung cấp 2 dòng sản phẩm chính trong danh mục cửa tự động thương mại, phù hợp với 2 nhóm nhu cầu kiến trúc khác nhau.
            - heading "1.1. Cửa trượt tự động 2 cánh" [level=3] [ref=f18e117]
            - paragraph [ref=f18e118]: "Đây là giải pháp cửa hiện đại dành cho các khu vực có lưu lượng người qua lại lớn như sảnh chính, tòa nhà văn phòng, khách sạn, chung cư và trung tâm thương mại. Sản phẩm có 2 mẫu thiết kế: cánh kính trượt có khung nhôm và không khung nhôm, chiều cao tối đa đến 3m, kết cấu bền chắc, chịu lực tốt và vận hành êm ái."
            - paragraph [ref=f18e119]: "Hệ cửa tích hợp 4 chế độ vận hành gồm: tự động, mở thường trực, mở một chiều và ban đêm. Đồng thời, cửa có khả năng tự kiểm tra, cảnh báo lỗi và kết nối với hệ thống báo cháy tòa nhà, giúp tăng tính an toàn, tiện nghi và thẩm mỹ cho công trình."
            - img "Cửa trượt tự động 2 cánh Eurowindow" [ref=f18e121]
            - paragraph [ref=f18e122]:
              - emphasis [ref=f18e123]: Cửa trượt tự động 2 cánh Eurowindow
            - paragraph [ref=f18e124]:
              - link "XEM SẢN PHẨM" [ref=f18e125] [cursor=pointer]:
                - /url: https://eurowindow.biz/cua-tu-dong/cua-truot-tu-dong-2-canh.html
            - heading "1.2. Cửa tự động xoay tròn 3 hoặc 4 cánh" [level=3] [ref=f18e126]
            - paragraph [ref=f18e127]: Đây là giải pháp cửa cao cấp, phù hợp để lắp đặt tại sảnh chính và lối vào các công trình có lưu lượng người qua lại lớn như tòa nhà văn phòng, trung tâm thương mại, khách sạn. Sản phẩm được nhập khẩu nguyên chiếc từ các hãng hàng đầu tại Đức và Italy, có kết cấu bền chắc, chịu lực tốt, vận hành êm ái, ổn định và không bị gián đoạn.
            - paragraph [ref=f18e128]: Hệ cửa tích hợp nhiều chế độ vận hành như Night (Khóa đêm an ninh), Revolve (Xoay liên tục tốc độ thấp), Automatic (Tự động kích hoạt khi có người), Exit (Chỉ đi ra) và Manual (Vận hành bằng tay khi mất điện), giúp kiểm soát linh hoạt luồng ra vào, tăng độ an toàn và tạo điểm nhấn sang trọng, chuyên nghiệp cho công trình.
            - img "Cửa tự động xoay tròn của Eurowindow" [ref=f18e130]
            - paragraph [ref=f18e131]:
              - emphasis [ref=f18e132]: Cửa tự động xoay tròn của Eurowindow
            - paragraph [ref=f18e133]:
              - link "XEM SẢN PHẨM" [ref=f18e134] [cursor=pointer]:
                - /url: https://eurowindow.biz/cua-tu-dong/cua-tu-dong-xoay-tron-3-hoac-4-canh.html
            - heading "2. Ưu điểm của cửa tự động Eurowindow" [level=2] [ref=f18e135]
            - heading "2.1. Phù hợp với khu vực có lưu lượng người qua lại lớn" [level=3] [ref=f18e136]
            - paragraph [ref=f18e137]: Cửa tự động Eurowindow được thiết kế cho các vị trí thường xuyên có nhiều người ra vào như sảnh chính, lối vào tòa nhà văn phòng, khách sạn, chung cư, trung tâm thương mại hoặc siêu thị. Với cửa trượt tự động 2 cánh, hệ cửa có kích thước lớn, chiều cao tối đa đến 3m, giúp tạo lối đi rộng và thuận tiện.
            - paragraph [ref=f18e138]: Trong khi đó, cửa tự động lồng xoay 3 hoặc 4 cánh giúp điều tiết dòng người ra vào ổn định, phù hợp với các công trình quy mô lớn cần kiểm soát luồng di chuyển hiệu quả.
            - heading "2.2. Vận hành tự động, linh hoạt theo từng nhu cầu sử dụng" [level=3] [ref=f18e139]
            - paragraph [ref=f18e140]: Cả 2 dòng cửa đều được tích hợp nhiều chế độ vận hành, giúp người dùng dễ dàng lựa chọn theo từng thời điểm và mục đích sử dụng. Cửa có thể tự động mở khi phát hiện người đến gần, giữ mở thường trực, chỉ cho phép đi một chiều hoặc khóa ban đêm để tăng kiểm soát ra vào.
            - paragraph [ref=f18e141]: Với cửa lồng xoay, người dùng còn có thể chọn chế độ quay liên tục, tự động khởi động khi có người tới gần hoặc vận hành bằng tay trong trường hợp cần thiết.
            - img "Cửa tự động Eurowindow vận hành linh hoạt theo nhu cầu sử dụng" [ref=f18e143]
            - paragraph [ref=f18e144]:
              - emphasis [ref=f18e145]: Cửa tự động Eurowindow vận hành linh hoạt theo nhu cầu sử dụng
            - heading "2.3. An toàn hơn trong quá trình sử dụng" [level=3] [ref=f18e146]
            - paragraph [ref=f18e147]: Cửa tự động Eurowindow chú trọng yếu tố an toàn khi vận hành tại những khu vực công cộng. Hệ cửa có khả năng tự kiểm tra, cảnh báo lỗi và có thể kết nối với hệ thống báo cháy của tòa nhà, hỗ trợ xử lý tình huống khẩn cấp.
            - paragraph [ref=f18e148]: Riêng cửa lồng xoay còn được kiểm soát tốc độ quay, hạn chế tình trạng cửa xoay quá nhanh do tác động của gió, giúp người dùng di chuyển an toàn hơn.
            - heading "2.4. Vận hành êm ái, ổn định và hạn chế gián đoạn" [level=3] [ref=f18e149]
            - paragraph [ref=f18e150]: Hệ thống động cơ, cảm biến và cơ cấu điều khiển được thiết kế để cửa đóng mở nhịp nhàng, hạn chế tiếng ồn, phù hợp với các công trình yêu cầu trải nghiệm ra vào chuyên nghiệp như khách sạn, văn phòng, trung tâm thương mại, siêu thị,... Cửa lồng xoay còn có khả năng hoạt động liên tục mà không bị gián đoạn, đáp ứng tốt nhu cầu sử dụng cường độ cao.
            - img "Cửa tự động Eurowindow vận hành êm ái, ổn định, phù hợp với những công trình yêu cầu trải nghiệm ra và chuyên nghiệp" [ref=f18e152]
            - paragraph [ref=f18e153]:
              - emphasis [ref=f18e154]: Cửa tự động Eurowindow vận hành êm ái, ổn định, phù hợp với những công trình yêu cầu trải nghiệm ra và chuyên nghiệp
            - heading "2.5. Độ bền cao, chịu lực tốt" [level=3] [ref=f18e155]
            - paragraph [ref=f18e156]: Cửa trượt tự động và cửa tự động lồng xoay Eurowindow đều có kết cấu chắc chắn, chịu lực tốt và độ bền cao. Đây là yếu tố quan trọng với các hệ cửa lắp đặt tại mặt tiền hoặc sảnh chính, nơi thường xuyên chịu tác động từ tần suất sử dụng lớn, gió, bụi và thay đổi thời tiết.
            - paragraph [ref=f18e157]: Độ cứng vững của hệ cửa giúp duy trì khả năng vận hành ổn định, đồng thời đảm bảo tính an toàn cho công trình trong quá trình sử dụng lâu dài.
            - heading "2.6. Tăng tính thẩm mỹ và sự chuyên nghiệp cho công trình" [level=3] [ref=f18e158]
            - paragraph [ref=f18e159]: Thiết kế gọn gàng, hiện đại và sang trọng giúp khu vực sảnh chính trở nên chuyên nghiệp, thuận tiện và có tính nhận diện cao hơn. Cửa trượt tự động phù hợp với không gian cần sự thông thoáng, tối giản; trong khi cửa lồng xoay tạo điểm nhấn sang trọng cho các công trình cao cấp như khách sạn, tòa nhà văn phòng hoặc trung tâm thương mại.
            - img "Cửa trượt tự động Eurowindow đảm bảo tính thẩm mỹ và sự chuyên nghiệp cho công trình" [ref=f18e161]
            - paragraph [ref=f18e162]:
              - emphasis [ref=f18e163]: Cửa trượt tự động Eurowindow đảm bảo tính thẩm mỹ và sự chuyên nghiệp cho công trình
            - heading "3. Điểm nổi bật trong công nghệ cửa tự động của Eurowindow" [level=2] [ref=f18e164]
            - heading "3.1. Hệ điều khiển tự động theo nhu cầu sử dụng" [level=3] [ref=f18e165]
            - paragraph [ref=f18e166]: Điểm đặc biệt của cửa tự động Eurowindow nằm ở khả năng thiết lập nhiều chế độ vận hành theo từng thời điểm và nhu cầu kiểm soát ra vào. Với cửa trượt tự động 2 cánh, hệ thống có thể chuyển đổi giữa các chế độ tự động, mở thường trực, mở một chiều hoặc khóa ban đêm.
            - paragraph [ref=f18e167]: Với cửa lồng xoay, các chế độ như Night, Revolve, Automatic, Exit và Manual giúp cửa vận hành linh hoạt hơn trong các tình huống khác nhau, từ giờ cao điểm, giờ đóng cửa đến khi cần thoát người một chiều.
            - heading "3.2. Cảm biến nhận diện chuyển động giúp cửa phản ứng chủ động" [level=3] [ref=f18e168]
            - paragraph [ref=f18e169]: Công nghệ cảm biến là yếu tố quan trọng giúp cửa tự động nhận biết người dùng khi đến gần và kích hoạt đóng mở phù hợp. Ở cửa trượt tự động, cảm biến giúp cửa mở khi có người đi qua và tự đóng lại sau đó, hạn chế thao tác chạm tay.
            - paragraph [ref=f18e170]: Với cửa lồng xoay, radar phát hiện người trong vùng cảm biến để điều chỉnh trạng thái quay hoặc tốc độ quay, giúp quá trình ra vào diễn ra chủ động, thuận tiện và đồng bộ với nhịp di chuyển thực tế.
            - img "Cơ chế cảm biến nhận diện chuyển động giúp cửa phản ứng chủ động" [ref=f18e172]
            - paragraph [ref=f18e173]:
              - emphasis [ref=f18e174]: Cơ chế cảm biến nhận diện chuyển động giúp cửa phản ứng chủ động
            - heading "3.3. Cơ chế kiểm soát tốc độ giúp vận hành ổn định hơn" [level=3] [ref=f18e175]
            - paragraph [ref=f18e176]: Cửa tự động lồng xoay Eurowindow được thiết kế với khả năng kiểm soát tốc độ quay theo từng chế độ cài đặt. Khi không có người, cửa có thể quay chậm hoặc dừng; khi có người bước vào vùng nhận diện, cửa tự động xoay với tốc độ phù hợp.
            - paragraph [ref=f18e177]: Ở chế độ Manual, tốc độ xoay bằng tay cũng được kiểm soát để hạn chế tình trạng cửa quay quá nhanh do tác động của gió. Đây là điểm công nghệ quan trọng giúp hệ cửa vận hành ổn định trong khu vực sảnh lớn hoặc mặt tiền công trình.
            - heading "3.4. Khả năng tự kiểm tra và cảnh báo lỗi trong quá trình vận hành" [level=3] [ref=f18e178]
            - paragraph [ref=f18e179]: Không chỉ đóng mở tự động, hệ cửa tự động Eurowindow còn có khả năng tự kiểm tra trạng thái hoạt động và phát hiện lỗi trong quá trình sử dụng. Khi có bất thường, hệ thống có thể đưa ra cảnh báo để người quản lý kịp thời kiểm tra, xử lý.
            - paragraph [ref=f18e180]: Tính năng này đặc biệt cần thiết với các công trình có tần suất sử dụng cao như tòa nhà văn phòng, khách sạn, trung tâm thương mại, nơi cửa cần duy trì khả năng vận hành liên tục và ổn định.
            - img "Hệ cửa tự động Eurowindow có khả năng cảnh báo lỗi trong quá trình sử dụng" [ref=f18e182]
            - paragraph [ref=f18e183]:
              - emphasis [ref=f18e184]: Hệ cửa tự động Eurowindow có khả năng cảnh báo lỗi trong quá trình sử dụng
            - heading "3.5. Tích hợp được với hệ thống kỹ thuật của tòa nhà" [level=3] [ref=f18e185]
            - paragraph [ref=f18e186]: Cửa tự động Eurowindow có thể kết nối với hệ thống báo cháy của tòa nhà, hỗ trợ công trình xử lý tình huống khẩn cấp theo kịch bản kỹ thuật đã thiết lập. Đây là điểm khác biệt so với các hệ cửa đóng mở cơ bản, bởi cửa không chỉ là lối ra vào mà còn có thể trở thành một phần trong hệ thống vận hành an toàn chung của công trình. Tính năng này phù hợp với các tòa nhà lớn, nơi yêu cầu cao về kiểm soát ra vào và an toàn vận hành.
            - heading "3.6. Công nghệ động cơ và phanh điện hỗ trợ kiểm soát trạng thái cửa" [level=3] [ref=f18e187]
            - paragraph [ref=f18e188]: Ở cửa tự động xoay, chế độ Night sử dụng khóa điện và phanh điện để giữ cửa ở trạng thái đóng, đồng thời ngừng hoạt động của các cảm biến. Cách thiết kế này giúp cửa được kiểm soát chặt chẽ ngoài giờ vận hành, hạn chế mở ngoài ý muốn.
            - paragraph [ref=f18e189]: Với cửa trượt tự động, hệ thống động cơ cũng được thiết kế để phối hợp với các chế độ mở, đóng, khóa và điều khiển, tạo nên một quy trình vận hành tự động, liền mạch và dễ quản lý.
            - img "Cửa tự động xoay của Eurowindow có hỗ trợ phanh điện để giữ cửa ở trạng thái đóng" [ref=f18e191]
