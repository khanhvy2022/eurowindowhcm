          - paragraph [ref=f44e80]: "Công trình Tòa nhà văn phòng Chính phủ có ý nghĩa quan trọng, biểu tượng cho cơ quan cao nhất của Chính phủ trong giai đoạn phát triển đổi mới. Eurowindow thi công các hạng mục: cửa sổ và vách nhôm kính lớn mặt dựng, cửa gỗ, mái kính Skylight và lam nhôm trên mái, cửa thép chống cháy, cửa nhôm chống cháy và vách kính hoa văn."
          - paragraph [ref=f44e81]: Eurowindow đồng hành cùng mỗi dự án từ khâu khảo sát, tư vấn giải pháp thiết kế, sản xuất đến lắp đặt — đảm bảo mỗi hạng mục đều đạt chuẩn chất lượng, đúng tiến độ. Sản phẩm cửa, vách kính và vật liệu xây dựng Eurowindow đáp ứng tiêu chuẩn Châu Âu về độ cách âm, cách nhiệt, an toàn và thẩm mỹ cho mọi công trình.
