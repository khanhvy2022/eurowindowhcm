          - generic [ref=f2e63]:
            - 'heading "Thể lệ chương trình khuyến mãi: \"Đón hạ sang - Nhận ưu đãi vàng\"" [level=1] [ref=f2e65]'
            - generic [ref=f2e66]:
              - generic [ref=f2e67]: 04/05/2026
              - link "Tin khuyến mãi" [ref=f2e70] [cursor=pointer]:
                - /url: https://eurowindow.biz/tin-tuc/tin-khuyen-mai
              - generic [ref=f2e73]: 18886 Lượt xem
            - generic [ref=f2e77]:
              - paragraph [ref=f2e78]:
                - emphasis [ref=f2e79]: Chào hè rực rỡ, từ ngày 04/05 - 25/06/2026, Eurowindow triển khai chương trình khuyến mãi (CTKM) “Đón hạ sang – Nhận ưu đãi vàng” dành cho khách hàng nhà riêng trên phạm vi toàn quốc. 100% khách hàng ký hợp đồng/ phụ lục hợp đồng được nhận quà tặng hấp dẫn với tổng giá trị lên đến hàng tỷ đồng!
              - paragraph [ref=f2e80]: "Cụ thể, tất cả khách hàng ký hợp đồng/ phụ lục hợp đồng (HĐ/PLHĐ) mua và lắp đặt sản phẩm Eurowindow trong thời gian diễn ra CTKM được tặng ngay bộ quà gồm: bình giữ nhiệt Lock&Lock và dù cầm tay Eurowindow. Khách hàng ký hợp đồng/phụ lục hợp đồng với giá trị từ 350 triệu đồng trở lên sẽ được tặng thêm 01 máy rửa bát Bosch (Đức). Khách hàng ký HĐ/PLHĐ giá trị từ 1 tỷ đồng trở lên sẽ tiếp tục được tặng thêm 01 voucher nghỉ dưỡng 4 ngày 3 đêm dành cho 4 người tại Radisson Blu Resort Cam Ranh tiêu chuẩn 5 sao quốc tế. Đặc biệt, khách hàng thanh toán 100% giá trị trong vòng 7 ngày sau khi ký HĐ/PLHĐ còn được Eurowindow ưu đãi giảm ngay 2%"
              - paragraph [ref=f2e81]: Đây là cơ hội “vàng” để khách hàng nắm bắt cơ hội sở hữu các giải pháp cửa – vách kính cao cấp Eurowindow, vừa tiết kiệm chi phí vừa rinh quà liền tay, hoàn thiện không gian sống hay đón tân gia rực rỡ trong mùa hè này.
              - generic [ref=f2e83]:
                - img "kv-ngang-1" [ref=f2e85]
                - emphasis [ref=f2e87]: Chương trình khuyến mãi “Đón hạ sang - Nhận ưu đãi vàng” của Eurowindow mang đến cho khách hàng quà tặng khủng
              - paragraph [ref=f2e88]:
                - strong [ref=f2e89]: THỂ LỆ CHƯƠNG TRÌNH KHUYẾN MÃI
              - list [ref=f2e90]:
                - listitem [ref=f2e91]:
                  - generic [ref=f2e92]:
                    - strong [ref=f2e93]: "Tên chương trình:"
                    - text: “ĐÓN HẠ SANG – NHẬN ƯU ĐÃI VÀNG”
                - listitem [ref=f2e94]:
                  - generic [ref=f2e95]:
                    - strong [ref=f2e96]: "Hàng hóa dùng để khuyến mãi:"
                    - text: Các sản phẩm của Eurowindow.
                - listitem [ref=f2e97]:
                  - generic [ref=f2e98]:
                    - strong [ref=f2e99]: "Thời gian khuyến mãi:"
                    - text: Từ ngày 04/05/2026 đến hết ngày 25/06/2026.
                - listitem [ref=f2e100]:
                  - strong [ref=f2e101]: "Đối tượng và phạm vi khuyến mãi:"
                  - text: Khách hàng ký HĐ/PLHĐ mua sản phẩm Eurowindow lắp đặt cho công trình nhà riêng trên phạm vi cả nước
                - listitem [ref=f2e102]:
                  - strong [ref=f2e103]: "Chi tiết nội dung và thể lệ tham gia chương trình:"
              - paragraph [ref=f2e104]:
                - strong [ref=f2e105]:
                  - emphasis [ref=f2e106]: "Điều kiện áp dụng:"
              - paragraph [ref=f2e107]: Áp dụng với các HĐ/PLHĐ ký trong thời gian khuyến mại từ ngày 04/05/2026 - 25/06/2026 và hoàn thành thủ tục thanh toán đặt cọc tối thiểu 30% giá trị hợp đồng/PLHĐ trước ngày 30/06/2026.
              - paragraph [ref=f2e108]:
                - strong [ref=f2e109]:
                  - emphasis [ref=f2e110]: "Quà tặng:"
              - list [ref=f2e111]:
                - listitem [level=1] [ref=f2e112]: Tất cả các khách hàng ký hợp đồng mua hàng đều sẽ nhận được 01 bộ quà tặng bao gồm bình giữ nhiệt Lock & Lock và dù cầm tay Eurowindow trị giá 500 nghìn đồng, tặng ngay sau khi ký hợp đồng.
                - listitem [level=1] [ref=f2e113]: Các khách hàng ký hợp đồng mua hàng từ 350 triệu đồng trở lên sẽ nhận thêm 01 máy rửa bát của hãng Bosch (Đức) trị giá 42,99 triệu đồng, tặng ngay sau khi ký hợp đồng và KH hoàn thành thủ tục thanh toán cọc theo CTKM. Mỗi một khách hàng chỉ được nhận 01 máy rửa bát tương ứng với một địa chỉ công trình.
                - listitem [level=1] [ref=f2e114]: Các khách hàng ký hợp đồng mua hàng từ 1 tỷ đồng trở lên sẽ nhận thêm 01 voucher Biệt thự 02 phòng ngủ có hồ bơi – Hướng biển cho 04 người trong 4 ngày 3 đêm, tại Radisson Blu Cam Ranh (gồm bữa sáng) trị giá 50 triệu, tặng ngay khi ký hợp đồng và KH hoàn thành thủ tục thanh toán cọc theo CTKM. Mỗi một khách hàng chỉ được nhận 01 voucher tương ứng với một địa chỉ công trình.
                - listitem [level=1] [ref=f2e115]: "Giảm ngay 2%: khi Khách hàng thanh toán 100% giá trị HĐ/PL trong vòng 07 ngày làm việc từ khi ký HĐ/PLHĐ (việc thanh toán 100% có thể áp dụng cho thanh toán nhiều lần miễn số tiền thanh toán đủ 100% và tuân theo thời hạn thanh toán trong vòng 07 ngày làm việc)."
              - paragraph [ref=f2e116]:
                - strong [ref=f2e117]:
                  - emphasis [ref=f2e118]: Điều kiện
                - emphasis [ref=f2e119]: ":"
                - text: Khuyến mãi chỉ áp dụng cho các hợp đồng/phụ lục hợp đồng nhà riêng ký trong thời gian khuyến mãi từ ngày 04/05/2026 đến hết ngày 25/06/2026, và hoàn thành thủ tục thanh toán đặt cọc tối thiểu 30% giá trị hợp đồng/phụ lục hợp đồng đến hết ngày 30/06/2026. Nếu sau ngày 30/06/2026, khách hàng vẫn chưa hoàn thành thủ tục đặt cọc theo quy định sẽ không được tham gia chương trình khuyến mãi.
              - paragraph [ref=f2e120]:
                - text: "-"
                - strong [ref=f2e121]: Lưu ý
                - text: ": Đối với các Khách hàng ký hợp đồng/phụ lục hợp đồng vào ngày cuối cùng của chương trình ("
                - strong [ref=f2e122]: 25/06/2026
                - text: "), tiến độ thanh toán để hưởng ưu đãi được quy định chi tiết như sau:"
              - paragraph [ref=f2e123]: "o Để hưởng chính sách Quà tặng: phải hoàn thành thanh toán đặt cọc tối thiểu 30% chậm nhất vào ngày 30/06/2026."
              - paragraph [ref=f2e124]: "o Để hưởng thêm giảm giá 2%: phải tiếp tục thanh toán phần còn lại để đạt đủ 100% giá trị Hợp đồng (sau khi trừ đi 2%) chậm nhất vào ngày 03/07/2026."
              - paragraph [ref=f2e125]: "o Ví dụ minh họa: khách hàng ký Hợp đồng trị giá 100.000.000 VNĐ vào ngày 25/06/2026:"
              - list [ref=f2e126]:
                - listitem [ref=f2e127]: Đến ngày 30/06/2026, khách hàng đã thanh toán 30.000.000 VNĐ, Đủ điều kiện nhận Quà tặng của CTKM.
                - listitem [ref=f2e128]: Để được hưởng chính sách giảm 2% (tương đương 2.000.000 VNĐ) Khách hàng cần thanh toán thêm 68.000.000 VNĐ chậm nhất vào ngày 03/07/2026. (Tổng số tiền thực tế khách hàng thanh toán là 98.000.000 VNĐ).
              - list [ref=f2e129]:
