          - generic [ref=f71e238]:
            - generic [ref=f71e239]:
              - paragraph [ref=f71e240]: Giới thiệu sản phẩm
              - generic [ref=f71e241]:
                - paragraph [ref=f71e242]: Đáp ứng nhu cầu kính của Eurowindow và cung cấp cho thị trường các loại kính cao cấp, Eurowindow đầu tư Trung tâm gia công kính tại lô 15 KCN Quang Minh, Mê Linh, Hà Nội với dây chuyền sản xuất hiện đại và đồng bộ hàng đầu tại Việt Nam.
                - paragraph [ref=f71e243]: "Các sản phẩm kính tiêu biểu: kính cường lực, kính bán cường lực, hộp kính khổ lớn, kính hoa văn, kính dán an toàn — dùng làm vách kính lớn, vách ngăn, cửa thủy lực, lan can cầu thang, cửa sổ, cửa đi, bàn kính, buồng tắm kính… Với tính an toàn, chịu lực cơ học cao, thẩm mỹ, loại trừ tia cực tím, cách âm, cách nhiệt, sản phẩm kính Eurowindow là lựa chọn hoàn hảo cho công trình dân dụng và công nghiệp."
            - generic [ref=f71e244]:
              - paragraph [ref=f71e245]: Chi tiết cấu tạo & công nghệ
              - generic [ref=f71e246]:
                - generic [ref=f71e247]:
                  - heading "Phòng kín kiểm soát nhiệt độ, độ ẩm" [level=3] [ref=f71e248]
                  - paragraph [ref=f71e249]: Hộp kính và kính an toàn được gia công trong phòng kín, độ ẩm ≤46%, nhiệt độ 20 – 28°C, hạn chế hơi ẩm, bụi bẩn ảnh hưởng tới chất lượng kính nhiều lớp.
                - generic [ref=f71e250]:
                  - heading "Dây chuyền thiết bị châu Âu" [level=3] [ref=f71e251]
                  - paragraph [ref=f71e252]: Máy cắt kính khổ lớn, máy mài song cạnh, máy khoan, máy gia công CNC, lò tôi kính phẳng, dây chuyền kính dán an toàn và hộp kính nhập khẩu từ Italia, Phần Lan, Thụy Sĩ, Đức.
                - generic [ref=f71e253]:
                  - heading "Kiểm tra Heat-Soak-Test" [level=3] [ref=f71e254]
                  - paragraph [ref=f71e255]: Sau khi tôi, kính cường lực được kiểm tra bằng thiết bị Heat-Soak-Test để loại bỏ tấm kính có nguy cơ lỗi tiềm ẩn trước khi đưa vào công trình.
                - generic [ref=f71e256]:
                  - heading "Kính khổ lớn" [level=3] [ref=f71e257]
                  - paragraph [ref=f71e258]: Khả năng tôi kính cường lực và bán cường lực dày từ 4mm đến 19mm, kích thước tối đa lên tới 2.800 × 6.000mm, phù hợp mặt dựng kính và vách kính lớn.
          - generic [ref=f71e259]:
            - paragraph [ref=f71e260]: Tính năng & ưu việt
            - generic [ref=f71e261]:
              - generic [ref=f71e262]:
                - heading "Độ an toàn cao" [level=3] [ref=f71e263]
                - paragraph [ref=f71e266]: Kính cường lực bền gấp 4 – 5 lần kính thường, khi vỡ tạo mảnh nhỏ ít sắc cạnh; kính bán cường lực cứng gấp 2 – 3 lần; kính dán an toàn liên kết màng PVB giữ mảnh kính khi va đập.
              - generic [ref=f71e267]:
                - heading "Tiêu chuẩn quốc tế" [level=3] [ref=f71e268]
                - paragraph [ref=f71e271]: Được Viện Tiêu chuẩn Anh BSI cấp chứng chỉ Kitemark, đáp ứng BS EN 12150-1:2000, BS EN 14449:2005, BS EN 1279-2:2002, EN 1863, ANSI Z97.1-2004, ECE R43.
              - generic [ref=f71e272]:
                - heading "Cách âm, cách nhiệt, tiết kiệm năng lượng" [level=3] [ref=f71e273]
                - paragraph [ref=f71e276]: Ứng dụng công nghệ tôi kính Super Soft Coating Low-E 0,01 hạn chế bức xạ mặt trời, kính cản nhiệt Low-E giảm khoảng 40% truyền nhiệt mùa hè, giảm áp lực điều hòa, phù hợp kiến trúc xanh.
              - generic [ref=f71e277]:
                - heading "Thẩm mỹ & linh hoạt" [level=3] [ref=f71e278]
                - paragraph [ref=f71e281]: "Đa dạng dòng kính: cường lực, bán cường lực, hộp kính, kính hoa văn, kính an toàn, kính phản quang, kính phủ cứng/phủ mềm — dễ lựa chọn theo từng không gian."
              - generic [ref=f71e282]:
                - heading "Chủ động sản xuất đồng bộ" [level=3] [ref=f71e283]
                - paragraph [ref=f71e286]: Nhiều dây chuyền trong cùng một trung tâm giúp kiểm soát độ chính xác từng chi tiết, đảm bảo đồng bộ chất lượng và tiến độ cho từng công trình.
