            - heading "Vì sao mua đất xây nhà phải kiểm tra trước khi thương lượng?" [level=2] [ref=f19e119]
            - heading "Giá đất chưa phải tổng chi phí" [level=3] [ref=f19e120]
            - paragraph [ref=f19e121]: Giá chuyển nhượng chỉ là khoản chi đầu tiên. Một lô đất rẻ có thể phát sinh tiền san lấp, ép cọc, nâng nền, trung chuyển vật tư hoặc điều chỉnh thiết kế vì vướng chỉ giới.
            - paragraph [ref=f19e122]:
              - text: Chủ nhà nên tính
              - strong [ref=f19e123]: tổng ngân sách hoàn thiện ngôi nhà
              - text: ", gồm giá mua, thuế phí, thiết kế, cấp phép, thi công, nội thất và dự phòng. Lô đất rẻ hơn chưa chắc tiết kiệm nếu chi phí xử lý nền và tổ chức thi công quá lớn."
            - figure "Kiểm tra giấy chứng nhận trước khi đặt cọc" [ref=f19e124]:
              - img "Mua Dat Xay Nha Dung Voi Neu Chua Kiem Tra 7 Dieu Nay00005" [ref=f19e125]
            - heading "Bốn yếu tố dễ bị bỏ qua" [level=3] [ref=f19e127]
            - paragraph [ref=f19e128]: Người mua nên cân nhắc vị trí, tiện ích, nguy cơ ngập và môi trường xung quanh. Các yếu tố này ảnh hưởng trực tiếp đến việc đi lại, sinh hoạt và chất lượng sống lâu dài.
            - paragraph [ref=f19e129]: Nên xem đất vào giờ cao điểm, buổi tối và sau mưa lớn để kiểm tra giao thông, tiếng ồn, an ninh, mùi và khả năng thoát nước.
            - paragraph [ref=f19e130]:
              - text: "Xem thêm:"
              - 'link "Phát sinh chi phí khi xây nhà: 8 giải pháp kiểm soát ngân sách" [ref=f19e131] [cursor=pointer]':
                - /url: https://catmoc.cmg.vn/phat-sinh-chi-phi-khi-xay-nha/
            - heading "Mua đất xây nhà cần rà soát pháp lý và quy hoạch" [level=2] [ref=f19e132]
            - figure "Cần kiểm tra quy hoạch và lộ giới" [ref=f19e133]:
              - img "Mua Dat Xay Nha Dung Voi Neu Chua Kiem Tra 7 Dieu Nay00006" [ref=f19e134]
            - heading "Đối chiếu giấy chứng nhận và người bán" [level=3] [ref=f19e136]
            - paragraph [ref=f19e137]: Bước kiểm tra pháp lý đất đầu tiên là xem bản gốc giấy chứng nhận, đối chiếu tên người sử dụng, số thửa, diện tích, thời hạn và mục đích sử dụng. Không nên đặt cọc chỉ dựa trên bản chụp hoặc cam kết “sổ đang làm”.
            - paragraph [ref=f19e138]: Theo Điều 45 Luật Đất đai 2024, việc chuyển nhượng về nguyên tắc cần có giấy chứng nhận; đất không tranh chấp hoặc tranh chấp đã được giải quyết; không bị kê biên; còn thời hạn sử dụng; và không bị áp dụng biện pháp khẩn cấp tạm thời.
            - paragraph [ref=f19e139]: Khi kiểm tra pháp lý đất, cần xác minh thêm tình trạng thế chấp, ngăn chặn giao dịch, thừa kế, tài sản chung vợ chồng hoặc đồng sở hữu. Hợp đồng đặt cọc phải nêu rõ điều kiện hoàn cọc và trách nhiệm nếu bên bán không đủ quyền chuyển nhượng.
            - heading "Đo ranh giới và diện tích thực tế" [level=3] [ref=f19e140]
            - paragraph [ref=f19e141]: Trong quá trình kiểm tra pháp lý đất, hãy so sánh kích thước trên giấy với ranh sử dụng ngoài thực địa. Tường rào lệch, lối đi chung, mốc ranh không rõ hoặc diện tích thực nhỏ hơn hồ sơ đều có thể làm thay đổi phương án nhà.
            - paragraph [ref=f19e142]: Với đất méo, xéo góc hoặc nằm trong khu dân cư lâu năm, nên thuê đo đạc hiện trạng. Sai lệch nhỏ cũng có thể ảnh hưởng cầu thang, chỗ đậu xe, giếng trời và kích thước phòng.
            - paragraph [ref=f19e143]:
              - text: "Xem thêm:"
              - 'link "Kinh nghiệm xây nhà lần đầu: tránh bẫy phát sinh chi phí" [ref=f19e144] [cursor=pointer]':
                - /url: https://catmoc.cmg.vn/kinh-nghiem-xay-nha-lan-dau-tranh-bay-phat-sinh-chi-phi/
            - heading "Xác định đất có xây nhà được không" [level=3] [ref=f19e145]
            - paragraph [ref=f19e146]: Để biết đất có xây nhà được không, hãy xem mục đích sử dụng trên giấy chứng nhận và đối chiếu quy hoạch. Nếu không phải đất ở, chủ sử dụng có thể phải xin chuyển mục đích và hoàn thành nghĩa vụ tài chính trước khi xây.
            - paragraph [ref=f19e147]: Luật Xây dựng 2025 có hiệu lực từ ngày 1/7/2026 tiếp tục yêu cầu việc cấp phép phù hợp với quy hoạch và mục đích sử dụng đất. Vì vậy, mua được đất không đồng nghĩa được xây đúng số tầng, mật độ hoặc diện tích mong muốn.
            - paragraph [ref=f19e148]: Khi kiểm tra quy hoạch đất, cần xem quy hoạch sử dụng đất, lộ giới, chỉ giới xây dựng, hành lang hạ tầng và chỉ tiêu kiến trúc. Đất không nằm trong kế hoạch thu hồi vẫn có thể bị giới hạn khoảng lùi, chiều cao hoặc mật độ.
            - paragraph [ref=f19e149]: Sau khi kiểm tra quy hoạch đất, người dân có thể đề nghị cung cấp dữ liệu về thửa đất, lịch sử biến động, giao dịch bảo đảm, trích lục bản đồ và quy hoạch sử dụng đất bằng bản giấy, email hoặc qua cổng thông tin đất đai.
            - paragraph [ref=f19e150]:
              - text: "Xem thêm:"
              - link "Buộc phải tháo dỡ xây nhà sai phép khi nào?" [ref=f19e151] [cursor=pointer]:
                - /url: https://catmoc.cmg.vn/buoc-phai-thao-do-xay-nha-sai-phep-khi-nao/
            - 'heading "Mua đất xây nhà: kiểm tra điều kiện sống và thi công" [level=2] [ref=f19e152]'
            - figure "Tránh các khu vực có nguy cơ ngập nước" [ref=f19e153]:
              - img "Mua Dat Xay Nha Dung Voi Neu Chua Kiem Tra 7 Dieu Nay00001" [ref=f19e154]
            - heading "Ngập nước, cao độ và thoát nước" [level=3] [ref=f19e156]
            - paragraph [ref=f19e157]: Để đánh giá đất có xây nhà được không về kỹ thuật, hãy quan sát cao độ khu đất so với mặt đường, nhà lân cận, miệng cống và hướng thoát nước. Nên hỏi nhiều hộ dân đã sống lâu năm.
            - paragraph [ref=f19e158]: Vệt ố chân tường, cửa nhà nâng cao bất thường hoặc đường thường xuyên được đắp thêm có thể cho thấy lịch sử ngập. Nếu nền thấp, chi phí nâng nền và chống trào ngược phải được đưa vào dự toán.
            - heading "Giao thông và vận chuyển vật tư" [level=3] [ref=f19e159]
            - paragraph [ref=f19e160]: Hẻm nhỏ có thể làm tăng chi phí xây dựng vì xe bê tông, xe chở thép hoặc thiết bị ép cọc không tiếp cận được. Vật tư khi đó phải trung chuyển bằng xe nhỏ hoặc thủ công.
            - paragraph [ref=f19e161]: Cần đo bề rộng hẻm, bán kính cua, chiều cao dây điện và vị trí tập kết vật tư. Đây là dữ liệu để đơn vị thiết kế thi công lập biện pháp và báo giá sát thực tế.
            - heading "Môi trường sống xung quanh" [level=3] [ref=f19e162]
            - paragraph [ref=f19e163]: Hãy quan sát cơ sở sản xuất, quán hoạt động ban đêm, bãi rác, kênh thoát nước, trạm điện và dự án lớn gần đó. Tiếng ồn, bụi hoặc mùi kéo dài rất khó xử lý hoàn toàn bằng kiến trúc.
            - paragraph [ref=f19e164]: Lưu ý môi trường, an toàn khu dân cư và ảnh hưởng từ công trình lân cận. Một căn nhà đẹp vẫn khó trở thành nơi ở tốt nếu gia đình phải đóng kín cửa cả ngày.
            - paragraph [ref=f19e165]:
              - text: "Xem thêm:"
              - link "Những lưu ý hạn chế xây nhà ảnh hưởng tới hàng xóm" [ref=f19e166] [cursor=pointer]:
                - /url: https://catmoc.cmg.vn/xay-nha-anh-huong-toi-hang-xom/
            - heading "Đánh giá thiết kế trước khi mua đất xây nhà" [level=2] [ref=f19e167]
            - figure "Đánh giá khả năng tiếp cận thi công" [ref=f19e168]:
              - img "Mua Dat Xay Nha Dung Voi Neu Chua Kiem Tra 7 Dieu Nay00002" [ref=f19e169]
            - heading "Hình dạng đất quyết định công năng" [level=3] [ref=f19e171]
            - paragraph [ref=f19e172]: Kiến trúc sư có thể trả lời đất có xây nhà được không theo nhu cầu cụ thể của gia đình, không chỉ theo nghĩa pháp lý. Cùng một diện tích, đất vuông vức và mặt tiền đủ rộng sẽ dễ bố trí hơn đất tóp hậu, xéo góc hoặc có cổ chai.
            - paragraph [ref=f19e173]: Trước khi đặt cọc, hãy cung cấp số thành viên, số phòng ngủ, nhu cầu đậu xe, thang máy, kinh doanh và ngân sách. Một mặt bằng sơ bộ có thể cho thấy lô đất nào phù hợp hơn.
            - heading "Đánh giá nền đất và tổng vốn" [level=3] [ref=f19e174]
            - paragraph [ref=f19e175]: Sau khi hoàn tất kiểm tra pháp lý đất, cần quan sát dấu hiệu ao lấp, nền đất cũ, kênh rạch, lún nứt của nhà bên cạnh và không gian thi công. Khảo sát ban đầu không thay thế khảo sát địa chất nhưng giúp nhận diện nguy cơ sớm.
            - paragraph [ref=f19e176]: Hãy so sánh giá mua, diện tích được xây, chi phí xử lý nền, vận chuyển vật tư và quy mô công năng. Ví dụ, lô A rẻ hơn 300 triệu đồng nhưng phải ép cọc sâu, nâng nền và giảm 8 m² vì lộ giới; lô B đắt hơn nhưng có thể kinh tế hơn khi tính toàn bộ dự án.
            - paragraph [ref=f19e177]:
              - text: "Xem thêm:"
              - link "Cách đọc bản vẽ thiết kế nhà chuẩn cho người mới xây nhà lần đầu" [ref=f19e178] [cursor=pointer]:
                - /url: https://catmoc.cmg.vn/cach-doc-ban-ve-thiet-ke-nha-chuan-cho-nguoi-moi-xay-nha-lan-dau/
            - heading "Quy trình mua đất xây nhà an toàn theo 7 bước" [level=2] [ref=f19e179]
            - figure "Mua đất xây nhà cùng đơn vị thiết kế thi công chuyên nghiệp" [ref=f19e180]:
              - img "Mua Dat Xay Nha Dung Voi Neu Chua Kiem Tra 7 Dieu Nay00003" [ref=f19e181]
            - heading "Checklist trước khi đặt cọc" [level=3] [ref=f19e183]
            - list [ref=f19e184]:
              - listitem [ref=f19e185]:
                - strong [ref=f19e186]: Xác định nhu cầu công năng và tổng ngân sách.
              - listitem [ref=f19e187]:
                - strong [ref=f19e188]: Xem bản gốc giấy chứng nhận và giấy tờ người bán.
              - listitem [ref=f19e189]:
                - strong [ref=f19e190]: Thực hiện kiểm tra quy hoạch đất từ nguồn chính thức.
              - listitem [ref=f19e191]:
                - strong [ref=f19e192]: Đo hiện trạng, xác định ranh và lối tiếp cận.
              - listitem [ref=f19e193]:
                - strong [ref=f19e194]: Khảo sát ngập, giao thông, tiếng ồn và môi trường.
              - listitem [ref=f19e195]:
                - strong [ref=f19e196]: Nhờ kiến trúc sư đánh giá phương án sơ bộ.
              - listitem [ref=f19e197]:
                - strong [ref=f19e198]: Chỉ đặt cọc khi các điều kiện quan trọng đã rõ.
            - paragraph [ref=f19e199]: Checklist này chuyển câu hỏi đất có xây nhà được không thành các tiêu chí có thể kiểm chứng, thay vì quyết định theo cảm xúc.
            - heading "Hợp đồng và thanh toán" [level=3] [ref=f19e200]
            - paragraph [ref=f19e201]: Hợp đồng cần ghi đúng thửa đất, giá, lịch thanh toán, thời hạn công chứng và trách nhiệm thuế phí. Nên quy định cách xử lý nếu kết quả kiểm tra quy hoạch đất khác với cam kết hoặc tài sản không đủ điều kiện chuyển nhượng.
            - paragraph [ref=f19e202]: Chỉ thanh toán theo các mốc pháp lý đã thỏa thuận. Mọi khoản tiền cần có chứng từ, nội dung rõ ràng và đúng người nhận.
            - 'heading "Kết luận: mua đất xây nhà cần nhìn xa hơn giá bán" [level=2] [ref=f19e203]'
            - heading "Ba việc không nên bỏ qua" [level=3] [ref=f19e204]
            - paragraph [ref=f19e205]: Trước khi xuống tiền mua đất xây nhà, hãy chắc chắn tài sản đủ điều kiện giao dịch, phù hợp mục đích xây ở, có giới hạn quy hoạch rõ ràng và nằm trong khả năng đầu tư thực tế.
            - paragraph [ref=f19e206]: Ba việc quan trọng nhất là kiểm tra pháp lý đất, kiểm tra quy hoạch đất và nhờ kiến trúc sư đánh giá sơ bộ. Chi phí kiểm tra ban đầu rất nhỏ so với giá trị giao dịch và hậu quả của một quyết định sai.
            - heading "Chọn đúng đất để xây đúng nhà" [level=3] [ref=f19e207]
            - paragraph [ref=f19e208]: Mua đất xây nhà là quyết định kết hợp giữa pháp lý, tài chính, kiến trúc và thi công. Một thửa đất phù hợp phải giúp gia đình xây đúng quy định, tối ưu công năng, kiểm soát ngân sách và duy trì chất lượng sống lâu dài.
            - paragraph [ref=f19e209]:
              - text: Cát Mộc Design & Construction có thể đồng hành từ đánh giá khu đất, tối ưu mặt bằng, triển khai hồ sơ thiết kế đến thi công hoàn thiện.
              - strong [ref=f19e210]: Chọn đúng đất ngay từ đầu là bước đầu tiên để xây đúng ngôi nhà.
            - paragraph [ref=f19e211]:
              - text: "Xem thêm:"
