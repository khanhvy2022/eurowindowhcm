        - generic [ref=e164]:
          - generic [ref=e165]:
            - paragraph [ref=e166]:
              - emphasis [ref=e167]: Với hơn 20 năm tiên phong tiêu chuẩn Châu Âu tại Việt Nam, Eurowindow cung cấp hệ
              - emphasis [ref=e168]:
                - strong [ref=e169]: cửa sổ nhôm
              - emphasis [ref=e170]: gồm cả dòng không cầu cách nhiệt và dòng có cầu cách nhiệt, kết hợp hộp kính bơm khí trơ Argon để hạn chế truyền nhiệt và tiết kiệm điện năng. Sản phẩm đã có mặt tại nhiều công trình lớn như Sân bay Quốc tế Nội Bài (T2), Vietcombank Tower và các tòa nhà cao tầng trên cả nước.
            - heading "1. Ưu điểm vượt trội của cửa sổ nhôm Eurowindow" [level=2] [ref=e171]
            - paragraph [ref=e172]:
              - text: Bên cạnh những ưu điểm chung của vật liệu nhôm,
              - strong [ref=e173]: cửa sổ nhôm
              - text: Eurowindow còn có nhiều thế mạnh riêng về công nghệ bề mặt, cách âm, cách nhiệt và khả năng tùy biến cho từng công trình.
            - heading "1.1. Độ bền cao, không cong vênh, không oxy hóa" [level=3] [ref=e174]
            - paragraph [ref=e175]: Khác với cửa gỗ hay cửa sắt, khung nhôm không cong vênh, không oxy hóa và chịu được điều kiện thời tiết nắng mưa tại Việt Nam. Nhờ đó, cửa sổ nhôm giữ được hình dáng và độ kín khít ổn định suốt vòng đời sử dụng, phù hợp với khí hậu nóng ẩm, mưa nhiều tại Việt Nam.
            - paragraph [ref=e176]: "Điểm khác biệt của Eurowindow nằm ở khâu xử lý bề mặt: profile nhôm được xử lý qua dây chuyền sơn tĩnh điện (Powder Coating) đạt chuẩn Tiger, Interpon D (AkzoNobel) và sơn nước PVDF theo tiêu chuẩn công nghiệp PPG, kết hợp dây chuyền sơn Jotun."
            - paragraph [ref=e177]: Các chuẩn sơn này đều đạt chứng nhận bảo hành màu sắc lên tới 30 năm (tiêu chuẩn AAMA2605-05), giúp bề mặt cửa không bạc màu, không bong tróc dù lắp đặt ở mặt tiền hướng nắng gắt hay khu vực gần biển.
            - img "Cửa sổ nhôm Eurowindow bền chắc, không cong vênh, bền màu theo thời gian" [ref=e179]
            - paragraph [ref=e180]:
              - emphasis [ref=e181]: Cửa sổ nhôm Eurowindow bền chắc, không cong vênh, bền màu theo thời gian
            - heading "1.2. Cách âm, cách nhiệt tốt với hệ có cầu cách nhiệt" [level=3] [ref=e182]
            - paragraph [ref=e183]: Ở các hệ có cầu cách nhiệt, lõi Polyamide đặt giữa thanh nhôm giúp cắt cầu nhiệt, hạn chế truyền nhiệt qua khung cửa. Khi kết hợp với hộp kính bơm khí trơ Argon, hệ cửa nâng cao rõ rệt khả năng cách âm và cách nhiệt. Tùy cấu hình, hệ EA60i đạt cách âm khoảng 33 đến 44dB, còn dòng thế hệ mới EA68i lên tới 47dB. Đây là lựa chọn phù hợp cho phòng ngủ, khách sạn và nhà gần trục giao thông cần sự yên tĩnh.
            - img "Cửa sổ nhôm có cầu cách nhiệt kết hợp kính hộp cho khả năng cách âm tốt" [ref=e185]
            - paragraph [ref=e186]:
              - emphasis [ref=e187]: Cửa sổ nhôm có cầu cách nhiệt kết hợp kính hộp cho khả năng cách âm tốt
            - heading "1.3. Tiết kiệm năng lượng, tiết kiệm điện cho công trình" [level=3] [ref=e188]
            - paragraph [ref=e189]: Cửa sổ nhôm có cầu cách nhiệt giảm đáng kể lượng nhiệt truyền qua khung và kính so với hệ không cầu, nhờ đó nhiệt độ trong nhà ổn định hơn khi thời tiết nắng nóng hoặc lạnh sâu. Điều này làm giảm tải cho hệ thống điều hòa, từ đó tiết kiệm điện năng trong quá trình sử dụng, phù hợp với các công trình sử dụng nhiều diện tích kính như căn hộ cao tầng, biệt thự có mặt kính lớn, văn phòng,...
            - img "Cửa sổ nhôm cách nhiệt giúp giảm tải điều hòa và tiết kiệm điện" [ref=e191]
            - paragraph [ref=e192]:
              - emphasis [ref=e193]: Cửa sổ nhôm cách nhiệt giúp giảm tải điều hòa và tiết kiệm điện
            - heading "1.4. Lấy sáng, thông gió linh hoạt nhờ đa dạng kiểu mở" [level=3] [ref=e194]
            - paragraph [ref=e195]: "Cửa sổ nhôm Eurowindow được thiết kế với nhiều kiểu mở để tối ưu lấy sáng và thông gió theo từng vị trí lắp đặt như: mở quay (trong hoặc ngoài) cho độ kín khít cao, mở quay lật kết hợp thông gió nhẹ mà vẫn ngăn mưa hắt, mở hất phù hợp vị trí cao khó với tay, và mở trượt tiết kiệm diện tích thao tác."
            - paragraph [ref=e196]: Việc lựa chọn đúng kiểu mở theo từng không gian như mở hất cho phòng vệ sinh, mở quay lật cho phòng ngủ, mở trượt cho ban công diện tích hẹp,... giúp công trình vừa đảm bảo lưu thông không khí tự nhiên, vừa hạn chế rủi ro va chạm cánh cửa trong sinh hoạt hàng ngày.
            - img "Cửa sổ nhôm nhiều kiểu mở giúp lấy sáng và thông gió linh hoạt" [ref=e198]
            - paragraph [ref=e199]:
              - emphasis [ref=e200]: Cửa sổ nhôm nhiều kiểu mở giúp lấy sáng và thông gió linh hoạt
            - heading "1.5. Đa dạng màu sắc, loại kính, phụ kiện" [level=3] [ref=e201]
            - paragraph [ref=e202]: Hệ cửa sổ nhôm Eurowindow có nhiều tùy chọn màu sơn như trắng, trắng bóng, các tông xám sần và vân gỗ dạng laminate, cho phép phối hợp với nhiều phong cách kiến trúc từ hiện đại tối giản đến cổ điển.
            - paragraph [ref=e203]: Sản phẩm hỗ trợ cả kính đơn và kính hộp, có hoặc không có nan trang trí bên trong, cùng nhiều dòng phụ kiện tiêu chuẩn như Roto, Cmech, Hafele, Kinlong và GMT. Nhờ vậy, hệ cửa dễ dàng may đo theo từng phong cách kiến trúc và mức ngân sách.
            - img "Cửa sổ nhôm đa dạng màu sơn, loại kính và phụ kiện" [ref=e205]
            - paragraph [ref=e206]:
              - emphasis [ref=e207]: Cửa sổ nhôm đa dạng màu sơn, loại kính và phụ kiện
            - heading "2. Các hệ cửa sổ nhôm của Eurowindow" [level=2] [ref=e208]
            - paragraph [ref=e209]: Eurowindow phát triển nhiều hệ profile cửa sổ nhôm, chia thành hai nhóm chính theo khả năng cách nhiệt để phù hợp với từng nhu cầu và ngân sách. Hệ không cầu cách nhiệt phù hợp ngân sách phổ thông và hệ có cầu cách nhiệt dành cho công trình yêu cầu cao về cách âm, cách nhiệt.
            - heading "2.1. Hệ cửa sổ nhôm không cầu cách nhiệt" [level=3] [ref=e210]
            - paragraph [ref=e211]: Các sản phẩm cửa sổ nhôm dùng hệ không cầu cách nhiệt có giá thành hợp lý, dễ lắp đặt và phù hợp với phần lớn công trình dân dụng, thương mại thông thường. Tuy nhiên, nhược điểm chung là khả năng cách âm, cách nhiệt không bằng nhóm có cầu cách nhiệt.
            - list [ref=e212]:
              - listitem [ref=e213]:
                - strong [ref=e214]: "EA55:"
                - text: Dùng cho cửa sổ mở quay, mở quay lật, độ cách âm tiêu chuẩn khoảng 32dB; profile cánh bo cong, dễ vệ sinh.
              - listitem [ref=e215]:
                - strong [ref=e216]: "EA65:"
                - text: Thế hệ mới phát triển từ EA55, profile rộng 65mm (tăng khoảng 18% so với EA55), thiết kế phẳng mặt khi đóng giúp ít bám bụi và tăng tính thẩm mỹ; đạt độ kín khí Class 3, độ kín nước Class 9, cách âm tối đa 33dB.
              - listitem [ref=e217]:
                - strong [ref=e218]: "EA70:"
                - text: Chuyên dùng cho cửa sổ mở trượt, độ cách âm khoảng 27dB, thao tác đóng mở nhẹ nhàng, tiết kiệm diện tích thi công.
              - listitem [ref=e219]:
                - strong [ref=e220]: "EA90:"
                - text: Dùng cho hệ cửa sổ mở trượt khổ lớn, thường dùng cho cửa đi kết hợp cửa sổ tại các mặt tiền cần tầm nhìn rộng.
            - heading "2.2. Hệ cửa sổ nhôm có cầu cách nhiệt" [level=3] [ref=e221]
            - paragraph [ref=e222]: "Nhóm hệ có cầu cách nhiệt trang bị lõi Polyamide ngăn cách hai lớp nhôm trong - ngoài, cho khả năng cách âm và cách nhiệt vượt trội so với hệ không cầu, phù hợp công trình cao cấp hoặc khu vực nhiều tiếng ồn. Các mã sản phẩm tiêu biểu:"
            - list [ref=e223]:
              - listitem [ref=e224]:
                - strong [ref=e225]: "EA60i:"
                - text: Dùng cho cửa sổ mở quay, mở hất, cách âm dao động 33 - 44dB tùy cấu hình kính, kính hộp lắp được tới 41mm.
              - listitem [ref=e226]:
                - strong [ref=e227]: "EA68i:"
                - text: Cải tiến với cầu cách nhiệt Polyamide rộng 24mm (tăng khoảng 50% so với hệ EA60i), profile 68mm, thiết kế 3 tầng gioăng cùng gioăng giữa cải tiến giúp tăng độ kín khí (Class 3) và kín nước (Class 9); cách âm tối đa tới 47dB, lắp được kính dày đến 49mm, phù hợp biệt thự, căn hộ cao cấp, khách sạn và công trình thương mại yêu cầu cao về hiệu suất năng lượng.
              - listitem [ref=e228]:
                - strong [ref=e229]: "EA95Wi:"
                - text: Dùng cho cửa sổ mở trượt khổ lớn có cầu cách nhiệt, kính hộp lên tới 41mm, phù hợp vị trí cần tầm nhìn rộng mà vẫn giữ khả năng cách âm tốt.
            - img "Cửa sổ nhôm hệ có cầu cách nhiệt, cách âm và cách nhiệt vượt trội" [ref=e231]
            - paragraph [ref=e232]:
              - emphasis [ref=e233]: Cửa sổ nhôm hệ có cầu cách nhiệt, cách âm và cách nhiệt vượt trội
            - heading "3. Các loại cửa sổ nhôm Eurowindow theo kiểu mở" [level=2] [ref=e234]
            - paragraph [ref=e235]: Cửa sổ nhôm Eurowindow còn có nhiều kiểu mở khác nhau, phù hợp với từng vị trí lắp đặt và nhu cầu sử dụng thực tế của công trình, từ lấy sáng, thông gió đến chống chịu thời tiết khắc nghiệt.
            - 'heading "3.1. Cửa sổ nhôm mở quay (trong/ngoài): Kín khít, cách âm tốt" [level=3] [ref=e236]'
            - paragraph [ref=e237]: Cửa sổ mở quay đóng kín khít nhờ hệ chốt và gioăng bao quanh, nên cách âm, cách nhiệt và chống thấm tốt hơn cửa trượt. Khách hàng có thể chọn hướng mở vào trong để dễ lau chùi, hoặc mở ra ngoài để không chiếm diện tích trong phòng. Mỗi hướng mở đều có loại một cánh và hai cánh, phù hợp cho phòng ngủ, phòng khách và mặt tiền công trình.
            - list [ref=e238]:
              - listitem [ref=e239]:
                - strong [ref=e240]: Cửa sổ nhôm 1 cánh mở quay trong
                - text: ": gọn gàng, phù hợp ô cửa vừa và nhỏ, dễ thao tác và vệ sinh."
              - listitem [ref=e241]:
                - strong [ref=e242]: Cửa sổ nhôm 2 cánh mở quay trong
                - text: ": khẩu độ rộng hơn, lấy sáng và thông gió tốt cho phòng khách, phòng ngủ."
              - listitem [ref=e243]:
                - strong [ref=e244]: Cửa sổ nhôm 1 cánh mở quay ngoài
                - text: ": mở ra ngoài, không chiếm diện tích trong phòng."
              - listitem [ref=e245]:
                - strong [ref=e246]: Cửa sổ nhôm 2 cánh mở quay ngoài
                - text: ": khẩu độ lớn, phù hợp vị trí cần tối ưu không gian bên trong."
            - img "Cửa sổ nhôm mở quay đóng kín khít, cách âm và chống thấm tốt" [ref=e248]
            - paragraph [ref=e249]:
              - emphasis [ref=e250]: Cửa sổ nhôm mở quay đóng kín khít, cách âm và chống thấm tốt
            - 'heading "3.2. Cửa sổ mở trượt lùa: An toàn trước gió bão, tiết kiệm diện tích" [level=3] [ref=e251]'
            - paragraph [ref=e252]: Cửa sổ mở trượt vận hành bằng cách di chuyển cánh theo phương ngang trên ray, giúp tiết kiệm không gian khi đóng mở và hạn chế tình trạng va đập do gió mạnh so với cửa mở quay, phù hợp với các khu vực miền Trung, ven biển, khu vực thường xuyên chịu ảnh hưởng bão. Kiểu mở này cũng tối ưu diện tích sử dụng cho ban công, hành lang hẹp vì không cần chừa khoảng trống cho cánh cửa xoay ra.
            - img "Cửa sổ nhôm mở trượt tiết kiệm diện tích, an toàn trước gió lớn" [ref=e254]
            - paragraph [ref=e255]:
              - emphasis [ref=e256]: Cửa sổ nhôm mở trượt tiết kiệm diện tích, an toàn trước gió lớn
            - 'heading "3.3. Cửa sổ mở hất và mở quay lật: Giải pháp thông minh cho mùa mưa" [level=3] [ref=e257]'
            - paragraph [ref=e258]: Cửa sổ mở hất và cửa sổ mở quay lật trong đều là những giải pháp hiện đại, được ưa chuộng nhờ khả năng thông gió hiệu quả và tính linh hoạt trong sử dụng.
            - list [ref=e259]:
              - listitem [ref=e260]:
                - strong [ref=e261]: Cửa sổ nhôm mở hất
                - text: ": Có đặc điểm cánh mở ra ngoài theo góc nghiêng, giúp tạo khe thoáng phía dưới, vừa đón gió tự nhiên vừa hạn chế nước mưa hắt vào bên trong."
              - listitem [ref=e262]:
                - strong [ref=e263]: Cửa sổ nhôm mở quay lật trong
                - text: ": Có thể mở theo hai chế độ: mở quay toàn phần hoặc lật nghiêng phần trên, cho phép điều chỉnh mức độ thông gió linh hoạt."
            - paragraph [ref=e264]: Ưu điểm chung của hai loại cửa này là tăng cường lưu thông không khí, đảm bảo an toàn, phù hợp với nhiều không gian như nhà ở, căn hộ cao tầng hoặc văn phòng, đồng thời góp phần nâng cao tính thẩm mỹ và tiện nghi cho công trình.
            - img "Cửa sổ nhôm mở quay lật thông gió tốt cả khi trời mưa" [ref=e266]
            - paragraph [ref=e267]:
