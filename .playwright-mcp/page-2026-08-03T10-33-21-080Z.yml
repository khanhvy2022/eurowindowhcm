              - emphasis [ref=e344]:
                - strong [ref=e345]: "Lưu ý:"
              - emphasis [ref=e346]: Mức giá trên chỉ mang tính tham khảo và thay đổi theo cấu hình thực tế. Để có báo giá chính xác, khách hàng nên liên hệ Eurowindow để được khảo sát và tư vấn theo công trình.
