            - heading "4. Tư vấn cách chọn cửa sổ nhôm phù hợp" [level=2] [ref=e349]
            - paragraph [ref=e350]: "Chọn đúng hệ cửa sổ nhôm cho từng vị trí giúp công trình vừa tối ưu chi phí, vừa đảm bảo hiệu quả sử dụng lâu dài. Dưới đây là các tiêu chí bạn nên cân nhắc trước khi quyết định:"
            - list [ref=e351]:
              - listitem [ref=e352]:
                - strong [ref=e353]: "Theo vị trí lắp đặt:"
                - text: Phòng ngủ và phòng làm việc nên ưu tiên hệ có cầu cách nhiệt (EA60i, EA68i) để giảm tiếng ồn; khu bếp, nhà vệ sinh phù hợp cửa mở hất để thông gió mà vẫn tránh nước hắt; mặt tiền và nhà cao tầng nên chọn hệ chịu lực tốt như EA65, EA68i để đảm bảo an toàn trước tải trọng gió.
              - listitem [ref=e354]:
                - strong [ref=e355]: "Theo nhu cầu cách âm - cách nhiệt:"
                - text: Nhà gần trục giao thông, khu đô thị đông đúc nên chọn hệ có cầu cách nhiệt kết hợp kính hộp thay vì hệ không cầu, để đạt mức cách âm 40 - 47 dB thay vì chỉ 27 - 33 dB.
              - listitem [ref=e356]:
                - strong [ref=e357]: "Theo kiểu mở phù hợp không gian:"
                - text: Ban công, hành lang hẹp phù hợp mở trượt; phòng ngủ, phòng khách phù hợp mở quay hoặc quay lật để tối ưu độ kín khít.
              - listitem [ref=e358]:
                - strong [ref=e359]: "Theo loại kính:"
                - text: Kính đơn phù hợp ngân sách tiết kiệm, kính hộp phù hợp yêu cầu cách âm - cách nhiệt cao; có thể chọn thêm nan trang trí nếu công trình theo phong cách cổ điển.
              - listitem [ref=e360]:
                - strong [ref=e361]: "Theo phụ kiện:"
                - text: Các thương hiệu Roto, Cmech, Hafele, Kinlong, GMT có mức giá và độ bền khác nhau, nên lựa chọn dựa trên tần suất sử dụng và ngân sách của công trình.
            - paragraph [ref=e362]: Trong mọi trường hợp, khách hàng nên trao đổi với đội ngũ tư vấn Eurowindow để được khảo sát và đề xuất hệ cửa, loại kính và phụ kiện phù hợp nhất với công trình.
            - img "Hãy cân nhắc kỹ để chọn cửa sổ nhôm phù hợp theo nhu cầu công trình" [ref=e364]
