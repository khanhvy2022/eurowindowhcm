    - generic [ref=f12e117]:
      - heading "Giới thiệu" [level=2] [ref=f12e119]
      - generic [ref=f12e120]:
        - generic [ref=f12e122]:
          - paragraph [ref=f12e123]: Năm 2002, Eurowindow tiên phong đưa cửa hiện đại uPVC tiêu chuẩn Châu Âu vào thị trường trong nước, làm nên cuộc cách mạng về cửa và mở ra “kỷ nguyên mới” cho những ngôi nhà Việt.
          - paragraph [ref=f12e124]:
            - generic [ref=f12e125]:
              - text: Qua hơn hai thập kỷ, Eurowindow không ngừng
              - strong [ref=f12e126]: TIÊN PHONG
              - text: "ứng dụng công nghệ mới, phát triển đa dạng các dòng sản phẩm gồm: cửa uPVC, cửa nhôm, vách nhôm kính lớn, cửa gỗ, cửa gỗ chống cháy, cửa tự động, cửa cuốn, cửa thủy lực, các sản phẩm kính, nội thất… Mới đây nhất, bộ giải pháp cửa thông minh thế hệ mới Eurowindow tích hợp công nghệ 4.0, thiết kế đa công năng, đem đến sự tiện nghi tối ưu cho người dùng. Luôn dẫn dắt nhu cầu và tạo ra xu hướng tiêu dùng mới, Eurowindow đã và đang góp phần"
              - strong [ref=f12e127]: KIẾN TẠO
              - text: "diện mạo kiến trúc các đô thị. Sản phẩm Eurowindow hiện diện ở hàng trăm nghìn công trình tại Việt Nam và nước ngoài, từ các tòa nhà chung cư, biệt thự, văn phòng, trụ sở làm việc các cơ quan nhà nước, tòa nhà ngân hàng, khách sạn, trường học, bệnh viện... cho đến các công trình trọng điểm như: Tòa nhà Quốc hội, Tòa nhà chính phủ, cảng hàng không quốc tế..."
            - link "Xem thêm" [ref=f12e129] [cursor=pointer]:
              - /url: /gioi-thieu.html
        - img "layer-211" [ref=f12e131]
