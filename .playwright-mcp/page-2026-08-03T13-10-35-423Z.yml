          - paragraph [ref=f33e73]: Cảng hàng không quốc tế Cần Thơ
          - paragraph [ref=f33e75]: Công trình Cảng hàng không quốc tế Cần Thơ có tổng vốn đầu tư khoảng 150 triệu USD
          - paragraph [ref=f33e78]: Bên cạnh sân bay có đường hạ cất cánh dài 3km, rộng 45m, có khả năng tiếp nhận các loại máy bay hiện đại như A320, A321, Boeing 747, Boeing 777-400, nhà ga hành khách có tổng diện tích xây dựng hơn 20.750m2 với kiến trúc hiện đại xen lẫn đặc thù văn hóa vùng sông nước. Phần mái (3 mái chính, 2 mái phụ) mang dáng dấp của năm chiếc xuồng ba lá cách điệu bằng những mảng hợp kim nhôm và vách nhôm kính lớn. Điểm nhấn đặc biệt trong thiết kế dự án này là sử dụng vách kính Spider với hệ thống khung thép đỡ và cáp giằng Inox 316 và CF8M. Hệ thống cửa chống khói thông minh, khi có khói tự động được tích hợp mở toàn bộ các cửa sổ mở hất ra ngoài (khi gặp mưa và gió sẽ tự động đóng lại).
